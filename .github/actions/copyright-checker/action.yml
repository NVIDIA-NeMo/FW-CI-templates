name: "Check Copyright Headers"
description: "Check that changed Python files have correct NVIDIA copyright headers"

inputs:
  changed-files:
    description: "Shell-quoted filenames or unquoted filename globs, separated by spaces"
    required: false
  changed-files-list:
    description: "File containing NUL-delimited paths from git diff -z"
    required: false

runs:
  using: "composite"
  steps:
    - name: Check copyright headers
      shell: bash
      env:
        CHANGED_FILES: ${{ inputs.changed-files }}
        CHANGED_FILES_LIST: ${{ inputs.changed-files-list }}
      run: |
        if [[ -n "$CHANGED_FILES_LIST" ]]; then
          xargs -0 -r python3 "$GITHUB_ACTION_PATH/check_copyright.py" -- < "$CHANGED_FILES_LIST"
        else
          python3 "$GITHUB_ACTION_PATH/check_copyright.py" --changed-files="$CHANGED_FILES"
        fi

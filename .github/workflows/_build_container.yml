name: Build container
on:
  workflow_call:
    inputs:
      build-ref:
        required: false
        default: ${{ github.sha }}
        description: Ref (branch or SHA) to build
        type: string
      image-name:
        required: true
        description: Name of image to build & push
        type: string
      build-args:
        required: false
        description: Additional build args to use
        type: string
      build-contexts:
        required: false
        description: Additional build contexts to use
        type: string
      dockerfile:
        required: true
        description: Path to dockerfile
        type: string
      image-label:
        required: false
        description: Image label for pruning
        type: string
      prune-filter-timerange:
        required: false
        description: "Go duration strings (e.g. 10m, 1h30m) computed relative to the daemon machine's time"
        type: string
        default: 24h
      use-cache:
        required: false
        type: boolean
        description: "Improve build-time by using a cache image"
        default: true
      use-inline-cache:
        required: false
        type: boolean
        description: "Use inline cache (only if use-cache is true)"
        default: true
      runner:
        required: false
        type: string
        description: "Runner to use"
        default: self-hosted-azure-builder
      cache-from:
        required: false
        type: string
        description: "Cache from"
        default: ""
      has-azure-credentials:
        required: false
        description: "Whether to use Azure credentials to login to the ACR"
        type: boolean
        default: false
      target:
        required: false
        description: "The docker build stage to target"
        type: string
        default: ""
      enable-pull-cache:
        required: false
        description: "Whether to enable pull cache"
        type: boolean
        default: true
      registry:
        required: false
        description: "The registry to use"
        type: string
        default: nemoci.azurecr.io
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      GH_TOKEN:
        required: false
    outputs:
      container-uri:
        description: URI of container
        value: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.run_id }}

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  id-token: write
  contents: read

jobs:
  main:
    runs-on: ${{ inputs.runner }}
    environment:
      name: nemo-ci
      deployment: false
    env:
      IMAGE_REPOSITORY: ${{ format('{0}/{1}', inputs.registry, inputs.image-name) }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_REF: ${{ github.ref }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Install Azure CLI
        if: ${{ inputs.has-azure-credentials }}
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure Login
        if: ${{ inputs.has-azure-credentials }}
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure ACR Login
        if: ${{ inputs.has-azure-credentials }}
        run: |
          az acr login --name nemoci

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          ref: ${{ inputs.build-ref }}
          submodules: "recursive"

      - name: Clean runner cache
        env:
          LABEL: ${{ inputs.image-label }}
          PRUNE_FILTER_TIMERANGE: ${{ inputs.prune-filter-timerange }}
        run: |
          filters=()
          if [[ -n "$LABEL" ]]; then
            filters+=(--filter "label=nemo.library=$LABEL")
          fi
          docker system prune "${filters[@]}" --filter "until=$PRUNE_FILTER_TIMERANGE" --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # We use `docker` driver as this speeds things up for
          # trivial (non-multi-stage) builds.
          driver: ${{ inputs.use-inline-cache == true && 'docker' || 'docker-container' }}
          buildkitd-config: ${{ inputs.enable-pull-cache == true && '/etc/buildkit/buildkitd.toml' || null }}

      - name: Set TAGS and PR_NUMBER
        run: |
          if [[ "$IMAGE_REPOSITORY" == *$'\n'* || "$IMAGE_REPOSITORY" == *$'\r'* ]]; then
            echo "::error::registry and image-name must be single-line values"
            exit 1
          fi

          if [[ -z "$PR_NUMBER" && "$GH_REF" =~ refs/heads/pull-request/([0-9]+) ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
            printf 'PR_NUMBER=%s\n' "$PR_NUMBER" >> "$GITHUB_ENV"
          fi

          {
            printf 'TAGS<<EOF\n%s:%s\n' "$IMAGE_REPOSITORY" "$RUN_ID"
            if [[ "$GH_REF" == "refs/heads/main" ]]; then
              printf '%s:main\n' "$IMAGE_REPOSITORY"
            elif [[ -n "$PR_NUMBER" ]]; then
              printf '%s:%s\n' "$IMAGE_REPOSITORY" "$PR_NUMBER"
            fi
            printf 'EOF\n'
          } >> "$GITHUB_ENV"

      - name: Configure inline cache
        if: ${{ inputs.use-cache == true && inputs.use-inline-cache == true }}
        run: |
          docker pull -- "$IMAGE_REPOSITORY:main" || true
          if [[ "$GH_REF" != "refs/heads/main" && -n "$PR_NUMBER" ]]; then
            docker pull -- "$IMAGE_REPOSITORY:$PR_NUMBER" || true
          fi

          {
            printf 'CACHE_FROM<<EOF\n'
            if [[ "$GH_REF" != "refs/heads/main" ]]; then
              printf '%s:main\n' "$IMAGE_REPOSITORY"
            fi
            printf '%s\nEOF\nCACHE_TO=type=inline\n' "$TAGS"
          } >> "$GITHUB_ENV"

      - name: Configure registry cache
        if: ${{ inputs.use-cache == true && inputs.use-inline-cache == false }}
        run: |
          cache_image="${IMAGE_REPOSITORY}-buildcache"
          {
            printf 'CACHE_FROM<<EOF\n%s:main\n' "$cache_image"
            if [[ "$GH_REF" != "refs/heads/main" && -n "$PR_NUMBER" ]]; then
              printf '%s:%s\n' "$cache_image" "$PR_NUMBER"
            fi
            printf 'EOF\n'

            if [[ "$GH_REF" == "refs/heads/main" ]]; then
              printf 'CACHE_TO=type=registry,ref=%s:main,mode=max\n' "$cache_image"
            elif [[ -n "$PR_NUMBER" ]]; then
              printf 'CACHE_TO=type=registry,ref=%s:%s,mode=max\n' "$cache_image" "$PR_NUMBER"
            else
              printf 'CACHE_TO=\n'
            fi
          } >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          file: ${{ github.run_id }}/${{ inputs.dockerfile }}
          push: true
          build-args: ${{ inputs.build-args }}
          build-contexts: ${{ inputs.build-contexts }}
          cache-from: ${{ inputs.use-cache && (inputs.cache-from || env.CACHE_FROM) || '' }}
          cache-to: ${{ inputs.use-cache && env.CACHE_TO || '' }}
          no-cache: ${{ !inputs.use-cache }}
          tags: |
            ${{ env.TAGS }}
          pull: ${{ !inputs.use-cache }}
          context: ${{ github.run_id }}/
          target: ${{ inputs.target }}
          secrets: |
            GH_TOKEN=${{ secrets.GH_TOKEN }}

name: Build docs
on:
  workflow_call:
    inputs:
      docs-directory:
        description: "Directory where the docs will be built"
        required: false
        type: string
        default: "docs"
      requirements-file:
        description: "Requirements file for building the docs"
        required: false
        type: string
        default: ""
      fail-on-warning:
        description: "Whether to fail the build on Sphinx warnings"
        required: false
        type: boolean
        default: true
      sync-all:
        description: "Whether to sync all dependencies or just the docs group"
        required: false
        type: boolean
        default: false
      no-extras:
        description: "Whether to skip installing extras when sync-all is true"
        required: false
        type: string
        default: ""
      ref:
        description: Ref (SHA or branch name) to build the docs for
        required: false
        type: string
        default: ${{ github.sha }}
      root-dir:
        description: Sub-directory containing pyproject.toml (for monorepo consumers).
        required: false
        type: string
        default: "."
      skip-linkcheck:
        description: Skip the Sphinx linkcheck + broken-link validation. Use for repos that haven't curated a `broken_links_false_positives.json` yet.
        required: false
        type: boolean
        default: false

jobs:
  main:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: "recursive"
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        working-directory: ${{ inputs.root-dir }}
        env:
          NO_EXTRAS: ${{ inputs.no-extras }}
        run: |
          uv venv
          if [ "${{ inputs.sync-all }}" = "true" ]; then
            # Validate: only allow repeated --no-extra <name> flags
            if [ -n "$NO_EXTRAS" ]; then
              if ! echo "$NO_EXTRAS" | grep -qP '^(--no-extra\s+[a-zA-Z0-9._-]+\s*)+$'; then
                echo "::error::Invalid no-extras value: '$NO_EXTRAS'. Expected format: '--no-extra name1 --no-extra name2'"
                exit 1
              fi
            fi
            uv sync --all-extras --all-groups $NO_EXTRAS
          elif [ -f "${{ inputs.requirements-file }}" ]; then
            uv pip install -r "${{ inputs.requirements-file }}"
          else
            uv sync --only-group docs
          fi

      - name: Sphinx build
        working-directory: ${{ inputs.root-dir }}
        run: |
          source .venv/bin/activate
          cd ${{ inputs.docs-directory }}

          if [ "${{ inputs.fail-on-warning }}" = "true" ]; then
            echo "Building docs with --fail-on-warning"
            sphinx-build --fail-on-warning --builder html . _build/html
          else
            echo "Building docs without --fail-on-warning"
            sphinx-build --builder html . _build/html
          fi

      - name: Upload docs as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-html
          path: ${{ inputs.root-dir }}/${{ inputs.docs-directory }}/_build/html
          retention-days: 7

      - name: Sphinx linkcheck
        if: inputs.skip-linkcheck == false
        working-directory: ${{ inputs.root-dir }}
        run: |
          source .venv/bin/activate
          cd ${{ inputs.docs-directory }}
          sphinx-build \
            --define linkcheck_retries=3 \
            --define linkcheck_rate_limit_timeout=60 \
            --builder linkcheck \
            . _build/linkcheck || true

      - name: Upload linkcheck output
        if: inputs.skip-linkcheck == false
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linkcheck-artifact
          path: ${{ inputs.root-dir }}/${{ inputs.docs-directory }}/_build/linkcheck
          retention-days: 7

      - name: Check for unknown broken links
        if: inputs.skip-linkcheck == false
        working-directory: ${{ inputs.root-dir }}
        run: |
          FALSE_POSITIVES_JSON=${{ inputs.docs-directory }}/broken_links_false_positives.json
          NEEDS_REVIEW_JSON=${{ inputs.docs-directory }}/broken_links_needing_review.json
          LINKCHECK_JSON=${{ inputs.docs-directory }}/_build/linkcheck/output.json

          function check_environment {
            local err=0
            if ! [ -x "$(command -v jq)" ]; then
              echo "jq is required but is not found."
              err=$((err + 1))
            fi
            if [ ! -f "${LINKCHECK_JSON}" ]; then
              echo "Did not find linkcheck output JSON file: ${LINKCHECK_JSON}."
              err=$((err + 1))
            fi
            if [ "${err}" -gt 0 ]; then
              exit 2
            fi
          }

          function is_transient_transport_error {
            local entry=$1
            jq --exit-status '
              .status == "timeout" or
              (
                .status == "broken" and
                (.code // 0) == 0 and
                ((.info // "") | test(
                  "network is unreachable|no route to host|temporary failure in name resolution|name or service not known|nameresolutionerror|could not resolve|connection (reset|aborted|refused|timed out)|connecttimeouterror|readtimeouterror|remote end closed connection|remotedisconnected";
                  "i"
                ))
              )
            ' <<< "$entry" > /dev/null
          }

          function check_links {
            local err=0
            local transient=0
            while IFS= read -r entry
            do
              if is_transient_transport_error "$entry"; then
                transient=$((transient + 1))
                echo "::warning::Transient link transport failure after bounded retries: $entry"
                continue
              fi

              link=$(echo "$entry" | jq -r '.uri')
              local false_positive_resp="false"
              local needs_review_resp="false"
              if [ -f "${FALSE_POSITIVES_JSON}" ]; then
                false_positive_resp=$(jq --arg check "${link}" -s 'any(.uri == $check)' < "${FALSE_POSITIVES_JSON}")
              fi
              if [ -f "${NEEDS_REVIEW_JSON}" ]; then
                needs_review_resp=$(jq --arg check "${link}" -s 'any(.uri == $check)' < "${NEEDS_REVIEW_JSON}")
              fi

              # "false" indicates that the URL did not match any of the URIs in the false positive file.
              if [[ "false" = "${false_positive_resp}" && "false" = "${needs_review_resp}" ]]; then
                err=$((err + 1))
                echo "$entry"
              fi
            done < <(jq -c 'select(.status == "broken" or .status == "timeout")' "$LINKCHECK_JSON")

            if [ "${transient}" -gt 0 ]; then
              echo "Found ${transient} transient link transport failure(s); all were checked and reported as warnings"
            fi
            if [ "${err}" -gt 0 ]; then
              echo "Found ${err} broken links that are not in exclusion lists"
              exit 1
            fi
          }

          check_environment
          check_links

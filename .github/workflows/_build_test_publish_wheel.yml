name: Build, test, and publish a PyPi wheel

on:
  workflow_call:
    inputs:
      python-package:
        type: string
        description: Name of Python package
      python-version:
        type: string
        description: Python version
        default: "3.10"
        required: false
      ref:
        required: false
        description: Ref (SHA or branch) to release
        type: string
        default: ${{ github.sha }}
      packaging:
        required: false
        description: "Packaging tool (supported: setuptools, uv)"
        type: string
        default: setuptools
      no-publish:
        required: false
        description: Do not publish the wheel
        type: boolean
        default: false
      suppress-failure-notify:
        required: false
        description: Suppress the failure Slack notification (used for PR rehearsals where failures should not page).
        type: boolean
        default: false
      has-src-dir:
        required: false
        description: Whether the package has a src directory
        type: boolean
        default: false
      skip-test-wheel:
        required: false
        description: Skip the test wheel step
        type: boolean
        default: false
      skip-check-manifest:
        required: false
        description: Skip check-manifest validation. Use for repos that intentionally exclude dev tooling (`.claude/`, `docs/`, `docker/`, …) from the sdist without maintaining a `[tool.check-manifest] ignore` block.
        type: boolean
        default: false
      wheel-content-ignore:
        required: false
        description: Comma-separated check-wheel-contents codes to ignore (e.g. "W002,W004,W009"). W002+W004 are common no-ops; add W009 for repos that ship multiple top-level packages in one wheel.
        type: string
        default: "W002,W004"
      custom-container:
        required: false
        description: Custom container to use for the build
        type: string
        default: ""
      runner:
        required: false
        description: Runner to use for the build
        type: string
        default: ubuntu-latest
      no-build-isolation:
        required: false
        description: Do not build the package in isolation
        type: boolean
        default: false
      submodules:
        required: false
        description: Whether to checkout submodules
        type: string
        default: ""
      root-dir:
        required: false
        description: Navigate into a sub-directory (mind the / at the end)
        type: string
        default: "./"
      container-options:
        required: false
        description: Options to pass to the container
        type: string
        default: " "
      build-wheel-env:
        required: false
        description: JSON object of non-secret string environment variables to export for the wheel build
        type: string
        default: "{}"
      extra-no-build-isolation-packages:
        required: false
        description: Space-separated list of extra packages to pre-install before building with --no-build-isolation (e.g. "grpcio-tools protobuf")
        type: string
        default: ""
      repository-url:
        description: Package index upload endpoint
        type: string
        required: false
        default: https://upload.pypi.org/legacy/
    secrets:
      SLACK_WEBHOOK:
        required: false
      TWINE_USERNAME:
        required: false
      TWINE_PASSWORD:
        required: false
      SLACK_WEBHOOK_ADMIN:
        required: false
      GH_TOKEN:
        required: false
    outputs:
      version:
        description: NeMo library version
        value: ${{ jobs.build-test-wheel.outputs.version }}
      pypi-name:
        description: NeMo library name on PyPi
        value: ${{ jobs.build-test-wheel.outputs.pypi-name }}

      artifact-name:
        description: Artifact containing the built distributions
        value: ${{ jobs.build-test-wheel.outputs.artifact-name }}

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  build-test-wheel:
    uses: ./.github/workflows/_build_test_wheel.yml
    with:
      python-package: ${{ inputs.python-package }}
      python-version: ${{ inputs.python-version }}
      ref: ${{ inputs.ref }}
      packaging: ${{ inputs.packaging }}
      has-src-dir: ${{ inputs.has-src-dir }}
      skip-test-wheel: ${{ inputs.skip-test-wheel }}
      skip-check-manifest: ${{ inputs.skip-check-manifest }}
      wheel-content-ignore: ${{ inputs.wheel-content-ignore }}
      custom-container: ${{ inputs.custom-container }}
      runner: ${{ inputs.runner }}
      no-build-isolation: ${{ inputs.no-build-isolation }}
      submodules: ${{ inputs.submodules }}
      root-dir: ${{ inputs.root-dir }}
      container-options: ${{ inputs.container-options }}
      build-wheel-env: ${{ inputs.build-wheel-env }}
      extra-no-build-isolation-packages: ${{ inputs.extra-no-build-isolation-packages }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  publish-wheel:
    needs: [build-test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.no-publish && 'public' || 'main' }}
      deployment: false
    steps:
      - name: Download wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pip-wheel-${{ github.run_id }}-${{ inputs.python-package || 'none' }}
          path: dist/

      - name: Release wheel
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ inputs.repository-url }}
          DRY_RUN: ${{ inputs.no-publish }}
        run: |
          python3 -m pip install --upgrade twine==6.0.1
          ls -la dist/

          if [[ "$DRY_RUN" == "false" ]]; then
            [[ -z "$TWINE_USERNAME" ]] && { echo "::error::TWINE_USERNAME unset"; exit 1; }
            [[ -z "$TWINE_PASSWORD" ]] && { echo "::error::TWINE_PASSWORD unset"; exit 1; }
            python3 -m twine upload --verbose --skip-existing -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" --repository-url "$TWINE_REPOSITORY_URL" dist/*
          else
            echo "[dry-run] would execute: python3 -m twine upload --verbose --skip-existing -u <user> -p <pass> --repository-url $TWINE_REPOSITORY_URL dist/*"
          fi

  notify:
    runs-on: ubuntu-latest
    if: failure() && inputs.suppress-failure-notify == false
    environment:
      name: public
      deployment: false
    needs: [build-test-wheel, publish-wheel]
    env:
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_WEBHOOK_ADMIN: "<!subteam^${{ secrets.SLACK_WEBHOOK_ADMIN }}>"
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: NVIDIA-NeMo/FW-CI-templates
          ref: v0.17.0
          path: send-slack-alert

      - name: Send Slack alert
        uses: ./send-slack-alert/.github/actions/send-slack-alert
        with:
          message: >
            <${{ env.RUN_URL }}|Build, test, and push PyPi wheel (test)> has failed for <${{ env.COMMIT_URL }}|${{ env.COMMIT_SHA }}>.

            cc: ${{ env.SLACK_WEBHOOK_ADMIN }}


          webhook: ${{ env.SLACK_WEBHOOK }}

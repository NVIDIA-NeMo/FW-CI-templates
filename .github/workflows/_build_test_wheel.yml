name: Build and test Python distributions

on:
  workflow_call:
    inputs:
      python-package:
        type: string
        description: Name of Python package
      python-version:
        type: string
        description: Python version
        default: "3.10"
        required: false
      ref:
        required: false
        description: Ref (SHA or branch) to release
        type: string
        default: ${{ github.sha }}
      packaging:
        required: false
        description: "Packaging tool (supported: setuptools, uv)"
        type: string
        default: setuptools
      has-src-dir:
        required: false
        description: Whether the package has a src directory
        type: boolean
        default: false
      skip-test-wheel:
        required: false
        description: Skip the test wheel step
        type: boolean
        default: false
      skip-check-manifest:
        required: false
        description: Skip check-manifest validation. Use for repos that intentionally exclude dev tooling (`.claude/`, `docs/`, `docker/`, …) from the sdist without maintaining a `[tool.check-manifest] ignore` block.
        type: boolean
        default: false
      wheel-content-ignore:
        required: false
        description: Comma-separated check-wheel-contents codes to ignore (e.g. "W002,W004,W009"). W002+W004 are common no-ops; add W009 for repos that ship multiple top-level packages in one wheel.
        type: string
        default: "W002,W004"
      custom-container:
        required: false
        description: Custom container to use for the build
        type: string
        default: ""
      runner:
        required: false
        description: Runner to use for the build
        type: string
        default: ubuntu-latest
      no-build-isolation:
        required: false
        description: Do not build the package in isolation
        type: boolean
        default: false
      submodules:
        required: false
        description: Whether to checkout submodules
        type: string
        default: ""
      root-dir:
        required: false
        description: Navigate into a sub-directory (mind the / at the end)
        type: string
        default: "./"
      container-options:
        required: false
        description: Options to pass to the container
        type: string
        default: " "
      build-wheel-env:
        required: false
        description: JSON object of non-secret string environment variables to export for the wheel build
        type: string
        default: "{}"
      extra-no-build-isolation-packages:
        required: false
        description: Space-separated list of extra packages to pre-install before building with --no-build-isolation (e.g. "grpcio-tools protobuf")
        type: string
        default: ""
    secrets:
      GH_TOKEN:
        required: false
    outputs:
      version:
        description: NeMo library version
        value: ${{ jobs.build-wheel.outputs.expected-version }}
      pypi-name:
        description: NeMo library name on PyPi
        value: ${{ jobs.build-wheel.outputs.name }}

      artifact-name:
        description: Artifact containing the built distributions
        value: ${{ jobs.build-wheel.outputs.artifact-name }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  build-wheel:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.custom-container || '' }}
      options: ${{ inputs.container-options }}
    outputs:
      expected-version: ${{ steps.build.outputs.version }}
      name: ${{ steps.build.outputs.name }}
      artifact-name: pip-wheel-${{ github.run_id }}-${{ inputs.python-package || 'none' }}
    env:
      PYPROJECT_NAME: ${{ inputs.python-package }}
      PACKAGING: ${{ inputs.packaging }}
      ROOTDIR: ${{ inputs.root-dir }}
      EXTRA_NO_BUILD_ISOLATION_PACKAGES: ${{ inputs.extra-no-build-isolation-packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          ref: ${{ inputs.ref }}
          submodules: ${{ inputs.submodules }}

      - name: Get Python version
        id: python-version
        env:
          REQUESTED_PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          cd -- "$GITHUB_RUN_ID"
          cd -- "$ROOTDIR"

          if [[ "$PACKAGING" == "uv" ]]; then
            if [ -f ".python-version" ]; then
              PYTHON_VERSION=$(cat .python-version)
            else
              echo "Error: .python-version file not found for uv packaging"
              exit 1
            fi
          else
            PYTHON_VERSION=$(printf '%s' "$REQUESTED_PYTHON_VERSION")
          fi
          PYTHON_VERSION=${PYTHON_VERSION%$'\r'}
          [[ "$PYTHON_VERSION" != *$'\n'* && "$PYTHON_VERSION" != *$'\r'* ]]
          printf 'version=%s\n' "$PYTHON_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Setup Python ${{ steps.python-version.outputs.version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: inputs.custom-container == ''
        with:
          python-version: "${{ steps.python-version.outputs.version }}"

      - name: Set build environment
        if: inputs.build-wheel-env != '{}'
        env:
          BUILD_WHEEL_ENV: ${{ inputs.build-wheel-env }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          values = json.loads(os.environ["BUILD_WHEEL_ENV"])
          if not isinstance(values, dict):
              raise TypeError("build-wheel-env must be a JSON object")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              for name, value in values.items():
                  if not isinstance(name, str) or re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", name) is None:
                      raise ValueError(f"invalid build environment variable name: {name!r}")
                  if not isinstance(value, str):
                      raise TypeError(f"build environment variable {name!r} must have a string value")
                  if "\n" in value or "\r" in value:
                      raise ValueError(f"build environment variable {name!r} must not contain newlines")
                  github_env.write(f"{name}={value}\n")
          PY

      - name: Build wheel
        id: build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SRC_DIR: ${{ inputs.has-src-dir && 'src/' || '' }}
          NO_BUILD_ISOLATION: ${{ inputs.no-build-isolation }}
          NO_VCS_VERSION: "1"
        run: |
          cd -- "$GITHUB_RUN_ID"
          cd -- "$ROOTDIR"
          ls -al

          if [[ "$GH_TOKEN" != "" ]]; then
            echo "machine github.com login x-access-token password $GH_TOKEN" > ~/.netrc
            chmod 600 ~/.netrc
          fi

          # Install the package to import and check the version in a later step
          installer=(pip)
          build_python=(python)
          if [[ "$PACKAGING" == "uv" ]]; then
            # Install uv
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv venv --system-site-packages .venv
            source .venv/bin/activate
            installer=(uv pip)
            build_python=(uv run --no-sync --active python)
          fi
          install_args=()
          if [[ "$NO_BUILD_ISOLATION" == "true" ]]; then
            install_args+=(--no-build-isolation)
            "${installer[@]}" install torch
            "${installer[@]}" install --upgrade setuptools pybind11 wheel_stub packaging poetry poetry-dynamic-versioning
            read -r -a extra_packages <<< "${EXTRA_NO_BUILD_ISOLATION_PACKAGES//$'\n'/ }"
            if (( ${#extra_packages[@]} )); then
              "${installer[@]}" install "${extra_packages[@]}"
            fi
          fi
          "${installer[@]}" install "${install_args[@]}" -e .

          # Build the wheel
          if [[ "$PACKAGING" == "uv" ]]; then
            uv build --out-dir ./dist/ .
          else
            python3 -m pip install --upgrade build
            python3 -m build --outdir ./dist/
          fi

          # Get the expected version and name of the package
          "${build_python[@]}" - <<'PY'
          import importlib
          import os
          from pathlib import Path

          package = importlib.import_module(os.environ["PYPROJECT_NAME"])
          outputs = {
              "version": package.__version__.rstrip("\n"),
              "name": package.__package_name__.rstrip("\n").replace("_", "-"),
              "DIST_DIR": str(Path.cwd() / "dist"),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  if "\r" in value or "\n" in value:
                      raise ValueError(f"wheel output {key} must be a single line")
                  print(f"{key}={value}", file=output)
          PY

          ls -al dist/

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pip-wheel-${{ github.run_id }}-${{ inputs.python-package || 'none' }}
          path: ${{ steps.build.outputs.DIST_DIR }}
          overwrite: true

  test-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    if: inputs.skip-test-wheel == false
    env:
      PYPROJECT_NAME: ${{ inputs.python-package }}
      EXPECTED_VERSION: ${{ needs.build-wheel.outputs.expected-version }}
      PACKAGING: ${{ inputs.packaging }}
      ROOTDIR: ${{ inputs.root-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          ref: ${{ inputs.ref }}

      - name: Download wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pip-wheel-${{ github.run_id }}-${{ inputs.python-package || 'none' }}
          path: dist/${{ github.run_id }}/

      - name: Get Python version
        id: python-version
        env:
          REQUESTED_PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          cd -- "$GITHUB_RUN_ID"
          cd -- "$ROOTDIR"

          if [[ "$PACKAGING" == "uv" ]]; then
            if [ -f ".python-version" ]; then
              PYTHON_VERSION=$(cat .python-version)
            else
              echo "Error: .python-version file not found for uv packaging"
              exit 1
            fi
          else
            PYTHON_VERSION=$(printf '%s' "$REQUESTED_PYTHON_VERSION")
          fi
          PYTHON_VERSION=${PYTHON_VERSION%$'\r'}
          [[ "$PYTHON_VERSION" != *$'\n'* && "$PYTHON_VERSION" != *$'\r'* ]]
          printf 'version=%s\n' "$PYTHON_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Setup Python ${{ steps.python-version.outputs.version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "${{ steps.python-version.outputs.version }}"

      - name: Install wheel
        run: |
          if [[ "$PACKAGING" == "uv" ]]; then
            # Install uv
            curl -LsSf https://astral.sh/uv/install.sh | sh

            # Create and activate virtual environment
            uv venv .venv
            source .venv/bin/activate
          fi

          cd -- "dist/$GITHUB_RUN_ID"

          ls -al

          if [[ "$PACKAGING" == "uv" ]]; then
            uv pip install ./*.whl
          else
            pip install ./*.whl
          fi

          python - <<'PY'
          import importlib
          import os

          package = importlib.import_module(os.environ["PYPROJECT_NAME"])
          if package.__version__.rstrip("\n") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Wheel has an outdated version, mission abort immediately!")
          PY

  validate-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    env:
      PACKAGING: ${{ inputs.packaging }}
      ROOTDIR: ${{ inputs.root-dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          ref: ${{ inputs.ref }}

      - name: Download wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pip-wheel-${{ github.run_id }}-${{ inputs.python-package || 'none' }}
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          python3 -m pip install --upgrade twine==6.0.1 check-wheel-contents check-manifest packaging pkginfo

      - name: twine check
        run: |
          python3 -m twine check dist/*

      - name: Check for direct URL dependencies
        run: |
          python3 - <<'PY'
          """Fail if any built distribution declares a PEP 508 direct URL dependency.

          PyPI rejects uploads whose metadata carries a ``Requires-Dist`` direct
          reference (e.g. ``pkg @ git+https://...``). ``twine check`` does not catch
          these, so the failure otherwise only surfaces at ``twine upload`` time.
          """

          import glob
          import sys

          from packaging.requirements import InvalidRequirement, Requirement
          from pkginfo import SDist, Wheel


          def direct_url_requirements(dist_path):
              """Return the direct URL requirement strings declared by a distribution.

              Args:
                  dist_path: Path to a built wheel (``.whl``) or sdist (``.tar.gz``).

              Returns:
                  The ``Requires-Dist`` specifiers that carry a PEP 508 direct URL.
              """
              metadata = Wheel(dist_path) if dist_path.endswith(".whl") else SDist(dist_path)
              offenders = []
              for spec in metadata.requires_dist or []:
                  try:
                      requirement = Requirement(spec)
                  except InvalidRequirement:
                      continue
                  if requirement.url:
                      offenders.append(spec)
              return offenders


          def main():
              """Scan ``dist/`` and exit non-zero if any direct URL dependency is found."""
              distributions = sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz"))
              found = False
              for dist_path in distributions:
                  for spec in direct_url_requirements(dist_path):
                      found = True
                      print(f"::error file={dist_path}::PyPI rejects direct URL dependencies: {spec}")
              if found:
                  print("Direct URL dependencies are not allowed on PyPI; replace them with a published release.")
                  sys.exit(1)
              print("No direct URL dependencies found.")


          if __name__ == "__main__":
              main()
          PY

      - name: check-wheel-contents
        env:
          WHEEL_CONTENT_IGNORE: ${{ inputs.wheel-content-ignore }}
        run: |
          check-wheel-contents --ignore="$WHEEL_CONTENT_IGNORE" dist/*.whl

      - name: check-manifest
        if: inputs.packaging == 'setuptools' && inputs.skip-check-manifest == false
        run: |
          cd -- "$GITHUB_RUN_ID"
          cd -- "$ROOTDIR"
          if [[ ! -f MANIFEST.in ]]; then
            echo "::notice::No MANIFEST.in found; skipping check-manifest."
            exit 0
          fi
          check-manifest -v

# Regularly updates the CI container
name: Bump dockerfile
on:
  workflow_call:
    inputs:
      source-repository:
        type: string
        required: true
      source-ref:
        type: string
        required: false
        default: main
      build-arg:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      base-branch:
        type: string
        required: false
        default: main
      cicd-label:
        type: string
        required: false
        default: Run CICD
      pr-reviewers:
        type: string
        required: false
    secrets:
      PAT:
        required: true

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  bump-dockerfile:
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    steps:
      - name: Checkout ${{ inputs.source-repository }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.source-repository }}
          ref: ${{ inputs.source-ref }}
          path: ${{ github.run_id }}

      - name: Get latest source commit
        id: ref
        env:
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        run: |
          cd "$GITHUB_RUN_ID"
          sha=$(git rev-parse HEAD)
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          repo=${SOURCE_REPOSITORY//\//-}
          echo "sha=${sha}" | tee -a "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" | tee -a "$GITHUB_OUTPUT"
          echo "date=$(date +%F)" | tee -a "$GITHUB_OUTPUT"
          echo "repo=$repo" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          token: ${{ secrets.PAT }}
          ref: ${{ inputs.base-branch }}

      - name: Bump Dockerfile
        env:
          FILE: ${{ inputs.dockerfile }}
          BUILD_ARG: ${{ inputs.build-arg }}
          VALUE: ${{ steps.ref.outputs.sha }}
        run: |
          cd "$GITHUB_RUN_ID"
          delimiter=$'\x1f'
          if [[ "$BUILD_ARG" == *"$delimiter"* || "$BUILD_ARG" == *$'\n'* ]]; then
            echo "build-arg must be a single-line pattern without the sed delimiter" >&2
            exit 1
          fi
          sed --sandbox -i -e "s${delimiter}^ARG $BUILD_ARG=.*${delimiter}ARG $BUILD_ARG=$VALUE${delimiter}" -- "$FILE"

      - name: Create Bump PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: create-pull-request
        env:
          title: 'chore(beep boop 🤖): Bump `${{ inputs.build-arg }}=${{ steps.ref.outputs.short_sha }}...` (${{ steps.ref.outputs.date }})'
        with:
          path: ${{ github.run_id }}
          branch: bump-ci-container--${{ steps.ref.outputs.repo }}-${{ steps.ref.outputs.date }}
          base: ${{ inputs.base-branch }}
          title: ${{ env.title }}
          token: ${{ secrets.PAT }}
          body: |
            🚀 PR to bump `${{ inputs.source-repository }}` in `${{ inputs.dockerfile }}` to `${{ inputs.build-arg }}=${{ steps.ref.outputs.sha }}`.

            📝 Please remember the following to-do's before merge:
            - [ ] Verify the presubmit CI

            🙏 Please merge this PR only if the CI workflow completed successfully.
          commit-message: ${{ env.title }}
          signoff: true
          reviewers: ${{ inputs.pr-reviewers }}
          labels: '${{ inputs.cicd-label }}'

name: Claude Code Review
on:
  workflow_call:
    inputs:
      trigger_phrase:
        description: Comment phrase that triggers the review
        required: false
        default: /claude review
        type: string
      model:
        description: Claude model to use
        required: false
        default: aws/anthropic/bedrock-claude-opus-4-8
        type: string
      prompt:
        description: Review prompt for Claude
        required: true
        type: string
    secrets:
      NVIDIA_INFERENCE_URL:
        required: true
      NVIDIA_INFERENCE_KEY:
        required: true

jobs:
  authorize:
    name: Authorize Claude review
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, inputs.trigger_phrase)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.permission.outputs.authorized }}
      base_sha: ${{ steps.pull_request.outputs.base_sha }}
      changed_files: ${{ steps.pull_request.outputs.changed_files }}
      head_sha: ${{ steps.pull_request.outputs.head_sha }}
      merge_base_sha: ${{ steps.pull_request.outputs.merge_base_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check trigger actor permission
        id: permission
        env:
          TRIGGER_ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          permission=$(gh api "repos/$REPO/collaborators/$TRIGGER_ACTOR/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) echo "authorized=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "authorized=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Capture pull request revision
        id: pull_request
        if: steps.permission.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          metadata=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid,changedFiles,headRefOid)
          base_sha=$(jq -er '.baseRefOid | select(type == "string")' <<< "$metadata")
          changed_files=$(jq -er '.changedFiles | select(type == "number") | tostring' <<< "$metadata")
          head_sha=$(jq -er '.headRefOid | select(type == "string")' <<< "$metadata")
          merge_base_sha=$(gh api "repos/$REPO/compare/$base_sha...$head_sha" --jq .merge_base_commit.sha)
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$merge_base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$changed_files" =~ ^[0-9]+$ ]]
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "merge_base_sha=$merge_base_sha" >> "$GITHUB_OUTPUT"

  context:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    uses: ./.github/workflows/_isolated_review_context.yml
    with:
      repository: ${{ github.repository }}
      pull_request: ${{ github.event.issue.number }}
      review_id: ${{ github.run_id }}-${{ github.run_attempt }}
      review_mode: manual
      base_sha: ${{ needs.authorize.outputs.base_sha }}
      merge_base_sha: ${{ needs.authorize.outputs.merge_base_sha }}
      head_sha: ${{ needs.authorize.outputs.head_sha }}
      changed_files: ${{ fromJSON(needs.authorize.outputs.changed_files) }}

  analyze:
    needs: [authorize, context]
    uses: ./.github/workflows/_isolated_review_analyze.yml
    with:
      artifact_name: ${{ needs.context.outputs.artifact_name }}
      model: ${{ inputs.model }}
      prompt: ${{ inputs.prompt }}
    secrets:
      NVIDIA_INFERENCE_URL: ${{ secrets.NVIDIA_INFERENCE_URL }}
      NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}

  publish:
    needs: [context, analyze]
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/_isolated_review_publish.yml
    with:
      context_artifact_name: ${{ needs.context.outputs.artifact_name }}
      result_artifact_name: ${{ needs.analyze.outputs.result_artifact_name }}

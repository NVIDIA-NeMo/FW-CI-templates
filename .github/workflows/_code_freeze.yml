name: "Code freeze"

on:
  workflow_call:
    inputs:
      library-name:
        type: string
        description: Name of Nemo library
      has-src-dir:
        required: false
        description: Whether the package has a src directory
        type: boolean
        default: false
      python-package:
        type: string
        description: Name of Python package
      release-type:
        type: string
        description: Type of release (major|minor)
      freeze-commit:
        type: string
        description: Commit SHA to use for cut-off
      freeze-source-branch:
        type: string
        required: false
        default: ""
        description: Require the caller to run on this branch and the cutoff to be reachable from the triggering commit
      dry-run:
        type: boolean
        description: Dry-run code-freeze
        default: true
      use-pat:
        required: false
        description: "Deprecated: use app-id and BOT_KEY for authentication"
        type: boolean
        default: false
      app-id:
        required: false
        description: GitHub App ID used for branch pushes and version-bump PRs
        type: string
        default: ""
      environment-name:
        required: false
        description: Job environment; empty preserves the legacy use-pat selection
        type: string
        default: ""
      release-environment:
        required: false
        type: string
        default: ""
        description: Protected environment providing RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY for a manual freeze on freeze-source-branch
      packaging:
        required: false
        description: "Packaging tool (supported: setuptools, hatch)"
        type: string
        default: setuptools
      release-branch-prefix:
        required: false
        description: "Prefix for the release branch name (e.g. 'core_' results in 'core_rX.Y.Z')"
        type: string
        default: ""
      next-pre-release:
        required: false
        description: "Pre-release tag for the next dev version bumped on main (e.g. 'rc0'); pass an empty string for clean semver"
        type: string
        default: rc0
      next-dev:
        required: false
        description: "Dev tag for the next dev version bumped on main (e.g. 'dev0'); pass an empty string to omit it"
        type: string
        default: dev0
    secrets:
      SLACK_WEBHOOK:
        required: true
      SLACK_WEBHOOK_ADMIN:
        required: true
      PAT:
        required: false
      BOT_KEY:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      release-branch:
        description: "Released version (same as its branch name)"
        value: ${{ jobs.create-release-branch.outputs.version }}

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  resolve-freeze-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require a protected freeze dispatch
        if: inputs.release-environment != '' && (github.event_name != 'workflow_dispatch' || inputs.freeze-source-branch == '')
        run: |
          echo "::error::Dispatch a protected freeze from its configured source branch."
          exit 1
      - name: Resolve freeze cutoff
        id: resolve
        if: inputs.freeze-source-branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FREEZE_SOURCE_BRANCH: ${{ inputs.freeze-source-branch }}
          FREEZE_COMMIT: ${{ inputs.freeze-commit }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$FREEZE_SOURCE_BRANCH" ]]; then
            echo "::error::Start the code freeze from the configured source branch."
            exit 1
          fi
          sha=$GITHUB_SHA
          if [[ -n "$FREEZE_COMMIT" && "$FREEZE_COMMIT" != "$FREEZE_SOURCE_BRANCH" ]]; then
            ref_path=$(jq -nr --arg ref "$FREEZE_COMMIT" '$ref | @uri')
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref_path" --jq '.sha')
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The freeze cutoff must resolve to a full commit SHA."
              exit 1
            fi
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq '.status')
            if [[ "$status" != identical && "$status" != ahead ]]; then
              echo "::error::The freeze cutoff must be on the configured source branch."
              exit 1
            fi
          fi
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"

  create-release-branch:
    needs: resolve-freeze-commit
    if: inputs.freeze-source-branch == '' || needs.resolve-freeze-commit.outputs.sha != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-branch.outputs.version }}
    env:
      DRY_RUN: ${{ inputs.dry-run }}
      SRC_DIR: ${{ inputs.has-src-dir && 'src/' || '' }}
      PYPROJECT_NAME: ${{ inputs.python-package }}
      RELEASE_BRANCH_PREFIX: ${{ inputs.release-branch-prefix }}
    environment:
      name: ${{ (inputs.release-environment != '' && inputs.dry-run && 'public') || inputs.release-environment || inputs.environment-name || (inputs.use-pat && 'main' || 'public') }}
      deployment: false
    steps:
      - name: Generate GitHub App token
        if: (inputs.release-environment != '' && !inputs.dry-run) || (inputs.release-environment == '' && inputs.app-id != '')
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.release-environment == '' && inputs.app-id || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets[inputs.release-environment == '' && 'BOT_KEY' || 'RELEASE_APP_PRIVATE_KEY'] }}
          permission-contents: write
          permission-administration: ${{ inputs.release-environment == '' && 'write' || 'read' }}

      - name: Select GitHub token
        id: github-token
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.release-environment }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
          APP_ID: ${{ inputs.app-id }}
          BOT_KEY: ${{ inputs.release-environment == '' && secrets.BOT_KEY || '' }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          LEGACY_TOKEN: ${{ inputs.release-environment == '' && inputs.use-pat && secrets.PAT || github.token }}
        run: |
          if [[ -n "$RELEASE_ENVIRONMENT" && "$DRY_RUN" != true ]]; then
            if [[ ! "$RELEASE_APP_ID" =~ ^[1-9][0-9]*$ || -z "$APP_TOKEN" ]]; then
              echo "::error::The protected environment requires a valid release App ID and installation token."
              exit 1
            fi
            TOKEN="$APP_TOKEN"
          elif [[ -z "$RELEASE_ENVIRONMENT" && ( -n "$APP_ID" || -n "$BOT_KEY" ) ]]; then
            if [[ -z "$APP_ID" || -z "$BOT_KEY" || -z "$APP_TOKEN" ]]; then
              echo "::error::App authentication requires app-id, BOT_KEY, and a minted token"
              exit 1
            fi
            TOKEN="$APP_TOKEN"
          else
            TOKEN="$LEGACY_TOKEN"
          fi
          echo "::add-mask::$TOKEN"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          fetch-depth: 0
          token: ${{ steps.github-token.outputs.token }}
          ref: ${{ inputs.freeze-source-branch == '' && inputs.freeze-commit || needs.resolve-freeze-commit.outputs.sha }}

      - name: Get release branch ref
        id: release-branch
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.release-environment }}
        run: |
          cd ${{ github.run_id }}

          PACKAGE_INFO_FILE="$SRC_DIR${PYPROJECT_NAME//.//}/package_info.py"

          sed -i "/^PRE_RELEASE/c\PRE_RELEASE = ''" "$PACKAGE_INFO_FILE"
          sed -i "/^DEV/c\DEV = ''" "$PACKAGE_INFO_FILE"

          pushd "$SRC_DIR${PYPROJECT_NAME//.//}"

          VERSION=$(python -c "import package_info; print(f\"{package_info.MAJOR}.{package_info.MINOR}.{package_info.PATCH}\")")
          RELEASE_BRANCH="${RELEASE_BRANCH_PREFIX}r${VERSION}"
          echo "version=${RELEASE_BRANCH}" | tee -a "$GITHUB_OUTPUT"

          git switch --force-create "${RELEASE_BRANCH}"

          if [[ "$DRY_RUN" != "true" && -z "$RELEASE_ENVIRONMENT" ]]; then
            git push -u origin "${RELEASE_BRANCH}" --force
          fi

      - name: Create protected release branch
        if: inputs.release-environment != '' && !inputs.dry-run
        working-directory: ${{ github.run_id }}
        env:
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.version }}
          CUTOFF_SHA: ${{ needs.resolve-freeze-commit.outputs.sha }}
        run: |
          ref="refs/heads/$RELEASE_BRANCH"
          if [[ ! "$CUTOFF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release branch requires a verified commit SHA."
            exit 1
          fi
          if [[ "$ref" == "$GITHUB_REF" ]] || ! git check-ref-format "$ref"; then
            echo "::error::The release destination must be a valid branch other than the freeze source."
            exit 1
          fi
          if git push --force-with-lease="$ref:" origin "$CUTOFF_SHA:$ref"; then
            exit 0
          fi
          current=$(git ls-remote --refs origin "$ref")
          if [[ "$current" == "$CUTOFF_SHA"$'\t'"$ref" ]]; then
            echo "The release branch already points to the verified cutoff."
            exit 0
          fi
          echo "::error::Could not create $ref at $CUTOFF_SHA. If the branch exists, its tip must match the verified cutoff."
          exit 1

  bump-next-version:
    runs-on: ubuntu-latest
    needs: [create-release-branch]
    environment:
      name: ${{ (inputs.release-environment != '' && inputs.dry-run && 'public') || inputs.release-environment }}
      deployment: false
    env:
      SRC_DIR: ${{ inputs.has-src-dir && 'src/' || '' }}
      PYPROJECT_NAME: ${{ inputs.python-package }}
    steps:
      - name: Generate GitHub App token
        if: (inputs.release-environment != '' && !inputs.dry-run) || (inputs.release-environment == '' && inputs.app-id != '')
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.release-environment == '' && inputs.app-id || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets[inputs.release-environment == '' && 'BOT_KEY' || 'RELEASE_APP_PRIVATE_KEY'] }}
          permission-contents: write
          permission-pull-requests: write

      - name: Select GitHub token
        id: github-token
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.release-environment }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
          APP_ID: ${{ inputs.app-id }}
          BOT_KEY: ${{ inputs.release-environment == '' && secrets.BOT_KEY || '' }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          LEGACY_TOKEN: ${{ inputs.release-environment == '' && inputs.use-pat && secrets.PAT || github.token }}
        run: |
          if [[ -n "$RELEASE_ENVIRONMENT" && "$DRY_RUN" != true ]]; then
            if [[ ! "$RELEASE_APP_ID" =~ ^[1-9][0-9]*$ || -z "$APP_TOKEN" ]]; then
              echo "::error::The protected environment requires a valid release App ID and installation token."
              exit 1
            fi
            TOKEN="$APP_TOKEN"
          elif [[ -z "$RELEASE_ENVIRONMENT" && ( -n "$APP_ID" || -n "$BOT_KEY" ) ]]; then
            if [[ -z "$APP_ID" || -z "$BOT_KEY" || -z "$APP_TOKEN" ]]; then
              echo "::error::App authentication requires app-id, BOT_KEY, and a minted token"
              exit 1
            fi
            TOKEN="$APP_TOKEN"
          else
            TOKEN="$LEGACY_TOKEN"
          fi
          echo "::add-mask::$TOKEN"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          ref: main
          token: ${{ steps.github-token.outputs.token }}
          persist-credentials: false

      - name: Bump version
        id: bump-version
        env:
          PACKAGING: ${{ inputs.packaging }}
          NEXT_PRERELEASE: ${{ inputs.next-pre-release }}
          NEXT_DEV: ${{ inputs.next-dev }}
        run: |
          cd ${{ github.run_id }}

          pushd "$SRC_DIR${PYPROJECT_NAME//.//}"

          MAJOR=$(python -c "import package_info; print(package_info.MAJOR)")
          MINOR=$(python -c "import package_info; print(package_info.MINOR)")

          if [[ "${{ inputs.release-type }}" == "major" ]]; then
            NEXT_MAJOR=$(( MAJOR + 1))
            NEXT_MINOR=0
          else
            NEXT_MAJOR=$MAJOR
            NEXT_MINOR=$(( MINOR + 1))
          fi

          NEXT_PATCH=0

          NEXT_VERSION="$NEXT_MAJOR.$NEXT_MINOR.$NEXT_PATCH$NEXT_PRERELEASE"
          if [[ -n "$NEXT_DEV" ]]; then
            NEXT_VERSION="$NEXT_VERSION.$NEXT_DEV"
          fi

          if [[ "$PACKAGING" == "setuptools" ]]; then
            sed -i "/^MAJOR/c\MAJOR = $NEXT_MAJOR" package_info.py
            sed -i "/^MINOR/c\MINOR = $NEXT_MINOR" package_info.py
            sed -i "/^PATCH/c\PATCH = $NEXT_PATCH" package_info.py
            sed -i "/^PRE_RELEASE/c\PRE_RELEASE = '$NEXT_PRERELEASE'" package_info.py
            sed -i "/^DEV/c\DEV = '$NEXT_DEV'" package_info.py
          elif [[ "$PACKAGING" == "hatch" ]]; then
            sed -i "/^__version__/c\__version__ = '$NEXT_VERSION'" package_info.py
          fi

          echo "version=$NEXT_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Create Version Bump PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: create-pull-request
        if: ${{ inputs.dry-run != true }}
        with:
          token: ${{ inputs.release-environment == '' && inputs.app-id == '' && github.token || steps.github-token.outputs.token }}
          path: ${{ github.run_id }}
          branch: ci/bump-${{ steps.bump-version.outputs.version }}
          title: "Version bump to `${{ steps.bump-version.outputs.version }}`"
          body: |
            🚀 Version bump ${{ inputs.library-name }} to `${{ steps.bump-version.outputs.version }}`
          commit-message: "[🤖]: Howdy folks, let's bump ${{ inputs.library-name }} to `${{ steps.bump-version.outputs.version }}` !"
          signoff: true
          assignees: okoenig

  notify:
    runs-on: ubuntu-latest
    needs: [create-release-branch, bump-next-version]
    environment:
      name: ${{ inputs.dry-run == true && 'public' || 'main' }}
      deployment: false
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      RELEASE_BRANCH: ${{ needs.create-release-branch.outputs.version }}
      SLACK_WEBHOOK_ADMIN: "<!subteam^${{ secrets.SLACK_WEBHOOK_ADMIN }}>"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: NVIDIA-NeMo/FW-CI-templates
          ref: v0.17.0
          path: send-slack-alert

      - name: Send Slack alert
        uses: ./send-slack-alert/.github/actions/send-slack-alert
        with:
          message: >
            ${{ inputs.dry-run == true && 'This is a dry-run, nothing actually happened: ' || '' }}We have frozen release branch `${{ env.RELEASE_BRANCH }}` of `${{ inputs.library-name }}` 🚀✨🎉

            PSA: To backport a PR into `${{ env.RELEASE_BRANCH }}`, comment `/cherrypick to=${{ env.RELEASE_BRANCH }}` on it, before or after it merges. Autobot opens the backport PR once the source PR is merged and reports progress in the `Autobot cherrypick (${{ env.RELEASE_BRANCH }})` check. If it fails, the check says why, and our team ${{ env.SLACK_WEBHOOK_ADMIN }} can help.


          webhook: ${{ env.SLACK_WEBHOOK }}

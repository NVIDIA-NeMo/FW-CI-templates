name: Community Bot

on:
  workflow_call:
    inputs:
      environment:
        required: false
        description: The environment to use for the workflow
        type: string
        default: "main"
      community_project_id:
        required: true
        description: The GitHub project ID to add community issues to
        type: string
      issue_number:
        required: false
        description: The issue number to test with
        type: string
      issue_author:
        required: false
        description: The issue author to test with
        type: string
      app-id:
        required: false
        description: The GitHub App ID to use for the bot token
        type: string
        default: ""
    secrets:
      BOT_KEY:
        required: false
      GH_TOKEN:
        description: Optional legacy PAT fallback
        required: false

jobs:
  manage-community-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      ISSUE_NUMBER: ${{ github.event_name == 'push' && inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}
      COMMUNITY_PROJECT_ID: ${{ inputs.community_project_id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Create repository GitHub App token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: repo-app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.BOT_KEY }}
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-organization-projects: ${{ github.repository_owner == 'NVIDIA-NeMo' && 'write' || '' }}
          permission-pull-requests: write

      - name: Create cross-organization GitHub App token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: cross-org-app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.BOT_KEY }}
          # The workflow is shared by repositories in these two organizations.
          owner: ${{ github.repository_owner == 'NVIDIA-NeMo' && 'NVIDIA' || 'NVIDIA-NeMo' }}
          permission-members: read
          permission-organization-projects: ${{ github.repository_owner != 'NVIDIA-NeMo' && 'write' || '' }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.repo-app-token.outputs.token || secrets.GH_TOKEN || github.token }}

      - name: Check pre-conditions
        id: pre-flight
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association || github.event.pull_request.author_association }}
          ACTOR_ASSOCIATION: ${{ github.event.comment.author_association || github.event.review.author_association }}
          ACTOR_TYPE: ${{ github.event.comment.user.type || github.event.review.user.type }}
          IS_VALID_EVENT: ${{ github.event_name == 'issues' || github.event_name == 'issue_comment' }}
          IS_FOLLOW_UP_EVENT: ${{ (github.event_name == 'issue_comment' && github.event.action == 'created') || (github.event_name == 'pull_request_review' && github.event.action == 'submitted') || (github.event_name == 'pull_request_review_comment' && github.event.action == 'created') }}
          ISSUE_AUTHOR: ${{ github.event_name == 'push' && inputs.issue_author || github.event.issue.user.login || github.event.pull_request.user.login }}
          REPO_GITHUB_TOKEN: ${{ steps.repo-app-token.outputs.token || secrets.GH_TOKEN || github.token }}
          NVIDIA_GITHUB_TOKEN: ${{ github.repository_owner == 'NVIDIA' && steps.repo-app-token.outputs.token || github.repository_owner == 'NVIDIA-NeMo' && steps.cross-org-app-token.outputs.token || secrets.GH_TOKEN || steps.repo-app-token.outputs.token || github.token }}
          NVIDIA_NEMO_GITHUB_TOKEN: ${{ github.repository_owner == 'NVIDIA-NeMo' && steps.repo-app-token.outputs.token || github.repository_owner == 'NVIDIA' && steps.cross-org-app-token.outputs.token || secrets.GH_TOKEN || steps.repo-app-token.outputs.token || github.token }}
        run: |
          # Get the username who triggered the action
          USERNAME="${{ github.actor }}"

          # For manual testing, always treat as community user
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Manual test mode - treating as community user"
            echo "is_maintainer=false" | tee -a "$GITHUB_OUTPUT"
            echo "is_valid_event=true" | tee -a "$GITHUB_OUTPUT"
            echo "username=$USERNAME" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          is_maintainer() {
            local user="$1"
            local association="$2"

            if [[ "$user" = "svcnemo-autobot" ]]; then
              return 0
            fi

            case "$association" in
              OWNER|MEMBER|COLLABORATOR)
                return 0
                ;;
            esac

            echo "Checking if $user is a repo collaborator..."
            API_URL="https://api.github.com/repos/$REPO/collaborators/$user"
            REPO_MEMBERSHIP_RESPONSE=$(curl --silent --show-error --output /dev/null \
              --write-out "%{http_code}" --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $REPO_GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL")

            echo "Checking if $user is an organization member of NVIDIA-NeMo..."
            API_URL="https://api.github.com/orgs/NVIDIA-NeMo/members/$user"
            ORG_NVIDIA_NEMO_MEMBERSHIP_RESPONSE=$(curl --silent --show-error \
              --output /dev/null --write-out "%{http_code}" --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $NVIDIA_NEMO_GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL")

            echo "Checking if $user is an organization member of NVIDIA..."
            API_URL="https://api.github.com/orgs/NVIDIA/members/$user"
            ORG_NVIDIA_MEMBERSHIP_RESPONSE=$(curl --silent --show-error --output /dev/null \
              --write-out "%{http_code}" --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $NVIDIA_GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL")

            if [[ "$REPO_MEMBERSHIP_RESPONSE" -eq 204 \
              || "$ORG_NVIDIA_NEMO_MEMBERSHIP_RESPONSE" -eq 204 \
              || "$ORG_NVIDIA_MEMBERSHIP_RESPONSE" -eq 204 ]]; then
              return 0
            fi

            return 1
          }

          is_bot_actor() {
            local user="$1"
            local actor_type="$2"

            [[ "$actor_type" = "Bot" \
              || "$user" = *"[bot]" \
              || "$user" = "svcnemo-autobot" ]]
          }

          if is_maintainer "$ISSUE_AUTHOR" "$AUTHOR_ASSOCIATION"; then
            IS_MAINTAINER=true
          else
            IS_MAINTAINER=false
          fi

          if is_bot_actor "$USERNAME" "$ACTOR_TYPE"; then
            IS_ACTOR_MAINTAINER=false
          elif is_maintainer "$USERNAME" "$ACTOR_ASSOCIATION"; then
            IS_ACTOR_MAINTAINER=true
          else
            IS_ACTOR_MAINTAINER=false
          fi

          echo "is_maintainer=$IS_MAINTAINER" | tee -a "$GITHUB_OUTPUT"
          echo "is_actor_maintainer=$IS_ACTOR_MAINTAINER" | tee -a "$GITHUB_OUTPUT"
          echo "is_follow_up_event=$IS_FOLLOW_UP_EVENT" | tee -a "$GITHUB_OUTPUT"
          echo "is_valid_event=$IS_VALID_EVENT" | tee -a "$GITHUB_OUTPUT"
          echo "username=$USERNAME" | tee -a "$GITHUB_OUTPUT"

      - name: Add community-request label for community users
        env:
          # Legacy Apps may only label pull requests; migrated Apps handle both issue types.
          GITHUB_TOKEN: ${{ github.event.issue.pull_request && steps.repo-app-token.outputs.token || secrets.GH_TOKEN || steps.repo-app-token.outputs.token || github.token }}
        if: |
          (
            steps.pre-flight.outputs.is_maintainer == 'false'
            && steps.pre-flight.outputs.is_valid_event == 'true'
          )
        run: |
          # Add the community-request label
          gh issue edit "$ISSUE_NUMBER" --add-label "community-request"

      - name: Add community issue to community project
        env:
          # The project lives in NVIDIA-NeMo even when the caller repository lives in NVIDIA.
          GITHUB_TOKEN: ${{ github.repository_owner == 'NVIDIA-NeMo' && steps.repo-app-token.outputs.token || steps.cross-org-app-token.outputs.token || secrets.GH_TOKEN || steps.repo-app-token.outputs.token || github.token }}
        if: |
          (
            steps.pre-flight.outputs.is_maintainer == 'false'
            && steps.pre-flight.outputs.is_valid_event == 'true'
          )
        run: |
          ISSUE_NODE_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq .node_id)
          # shellcheck disable=SC2016
          PROJECT_NODE_ID=$(gh api graphql -f query='
            query($projectNumber: Int!) {
              organization(login: "NVIDIA-NeMo") {
                projectV2(number: $projectNumber) {
                  id
                }
              }
            }' -F projectNumber="$COMMUNITY_PROJECT_ID" --jq .data.organization.projectV2.id)

          echo "Project ID: $PROJECT_NODE_ID"
          echo "Adding issue $ISSUE_NUMBER to project $COMMUNITY_PROJECT_ID"

          # shellcheck disable=SC2016
          RESPONSE=$(gh api graphql -f query='
              mutation($project:ID!, $issue:ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                  item {
                      id
                  }
                  }
              }' -f project="$PROJECT_NODE_ID" -f issue="$ISSUE_NODE_ID")

          echo "$RESPONSE"

          if grep -q "error" <<< "$RESPONSE"; then
            exit 1
          fi

      - name: Remove community-request label for maintainers
        env:
          GITHUB_TOKEN: ${{ github.event.issue.pull_request && steps.repo-app-token.outputs.token || secrets.GH_TOKEN || steps.repo-app-token.outputs.token || github.token }}
        if: |
          (
            steps.pre-flight.outputs.is_maintainer == 'true'
            && steps.pre-flight.outputs.is_valid_event == 'true'
          )
        run: |
          # Check if the issue has the "community-request" label before attempting to remove it
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "^community-request$"; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "community-request"
          else
            echo "Label 'community-request' not present on issue #$ISSUE_NUMBER, skipping removal."
          fi

      - name: Clear waiting-on-maintainers after maintainer activity
        env:
          GITHUB_TOKEN: ${{ github.event.pull_request && steps.repo-app-token.outputs.token || github.event.issue.pull_request && steps.repo-app-token.outputs.token || secrets.GH_TOKEN || steps.repo-app-token.outputs.token || github.token }}
        if: |
          (
            steps.pre-flight.outputs.is_actor_maintainer == 'true'
            && steps.pre-flight.outputs.is_follow_up_event == 'true'
          )
        run: |
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name')
          if grep -q "^waiting-on-maintainers$" <<< "$LABELS"; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "waiting-on-maintainers"
          else
            echo "Label 'waiting-on-maintainers' not present on issue #$ISSUE_NUMBER, skipping removal."
          fi

      - name: Log action taken
        run: |
          echo "User: ${{ steps.pre-flight.outputs.username }}"
          echo "Is maintainer: ${{ steps.pre-flight.outputs.is_maintainer }}"
          echo "Is actor maintainer: ${{ steps.pre-flight.outputs.is_actor_maintainer }}"
          echo "Is follow-up event: ${{ steps.pre-flight.outputs.is_follow_up_event }}"
          echo "Event: ${{ github.event_name }}"
          echo "Issue number: $ISSUE_NUMBER"

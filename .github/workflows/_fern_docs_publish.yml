# Publishes the Fern documentation site.
#
# Callers define their own trigger (push to main, tag, workflow_dispatch) and
# concurrency group. This workflow only handles the publish step.
#
# Required configuration:
# - GitHub OIDC trust for the caller and this pinned reusable workflow.
# - An AWS role that can read the configured Fern secret.
# - Caller permission: id-token: write.

name: Publish Fern Docs

on:
  workflow_call:
    inputs:
      aws-role-to-assume:
        description: AWS IAM role ARN used to read the Fern token
        required: true
        type: string
      aws-region:
        description: AWS region containing the Fern token secret
        required: false
        type: string
        default: us-east-2
      fern-secret-id:
        description: AWS Secrets Manager name or ARN containing the Fern token
        required: true
        type: string
      fern-directory:
        description: Path to the fern directory relative to the repository root
        required: false
        type: string
        default: fern
      docs-version:
        description: |
          Release version to stamp into the `slug: latest` Fern picker entry
          before publishing. The surrounding display-name text is preserved.
          Leave empty to publish docs.yml unchanged.
        required: false
        type: string
        default: ''
      container-image:
        description: |
          Optional container image to run the job in, such as
          ghcr.io/nvidia/docs-builder-ci:<semver>. Leave empty to run
          directly on the runner, which installs Node.js and fern-api
          before each run.
        required: false
        type: string
        default: ''
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container: ${{ inputs.container-image != '' && inputs.container-image || null }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Stamp release version in Fern picker
        if: inputs.docs-version != ''
        env:
          DOCS_VERSION: ${{ inputs.docs-version }}
          DOCS_YML: ${{ inputs.fern-directory }}/docs.yml
        run: |
          VERSION="${DOCS_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid Fern docs version: '$DOCS_VERSION'"
            exit 1
          fi

          if [[ ! -f "$DOCS_YML" ]]; then
            echo "::error::Fern docs configuration not found: $DOCS_YML"
            exit 1
          fi

          latest_count=$(yq '[.versions[] | select(.slug == "latest")] | length' "$DOCS_YML")
          if [[ "$latest_count" != "1" ]]; then
            echo "::error::$DOCS_YML must contain exactly one version with slug 'latest'"
            exit 1
          fi

          current_display=$(yq -r '.versions[] | select(.slug == "latest") | .display-name' "$DOCS_YML")
          if [[ "$current_display" =~ v?[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]+)? ]]; then
            current_version="${BASH_REMATCH[0]}"
            if [[ "$current_version" == v* ]]; then
              stamped_version="v$VERSION"
            else
              stamped_version="$VERSION"
            fi
            latest_display="${current_display/$current_version/$stamped_version}"
          else
            latest_display="$current_display · $VERSION"
          fi

          export latest_display
          yq -i \
            '(.versions[] | select(.slug == "latest") | .display-name) = strenv(latest_display)' \
            "$DOCS_YML"

          actual_display=$(yq -r '.versions[] | select(.slug == "latest") | .display-name' "$DOCS_YML")
          if [[ "$actual_display" != "$latest_display" ]]; then
            echo "::error::Failed to stamp release version in $DOCS_YML"
            exit 1
          fi
          echo "Fern latest picker: $current_display -> $actual_display"

      - name: Setup Node.js
        if: ${{ inputs.container-image == '' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        if: ${{ inputs.container-image == '' }}
        run: npm install -g fern-api

      - name: Detect Fern libraries field
        id: libraries
        run: |
          DOCS_YML="${{ inputs.fern-directory }}/docs.yml"
          if [ -f "$DOCS_YML" ] && yq -e '.libraries' "$DOCS_YML" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Read Fern token
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2
        with:
          secret-ids: |
            FERN_TOKEN,${{ inputs.fern-secret-id }}

      - name: Generate library reference MDX (autodocs)
        if: steps.libraries.outputs.present == 'true'
        run: |
          cd "$(dirname "${{ inputs.fern-directory }}")"
          fern docs md generate

      - name: Publish Docs
        run: |
          cd "$(dirname "${{ inputs.fern-directory }}")"
          fern generate --docs

name: Analyze isolated review context
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      model:
        required: true
        type: string
      prompt:
        required: true
        type: string
    secrets:
      NVIDIA_INFERENCE_URL:
        required: true
      NVIDIA_INFERENCE_KEY:
        required: true
    outputs:
      result_artifact_name:
        value: ${{ jobs.analyze.outputs.result_artifact_name }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      result_artifact_name: ${{ steps.names.outputs.result_artifact_name }}
    steps:
      - name: Download immutable context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: review-context

      - name: Verify immutable context
        run: python3 review-context/tools/review_components.py retrieve --context review-context --audit review-context/retrieval-audit.jsonl metadata > /dev/null

      - name: Prepare bounded analysis input
        env:
          CONSUMER_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          mkdir -p analysis-input
          cat > analysis-input/prompt.txt <<'PROMPT'
          Use only the audited retriever below to inspect the immutable review context.
          Do not access GitHub, the network, runner files, environment values, or shell commands.
          Return only structured output bound to the manifest.

          Use only the review_context MCP tools. Every operation is bounded and audited.
          PROMPT
          printf '\n%s\n' "$CONSUMER_PROMPT" >> analysis-input/prompt.txt
          cat > analysis-input/mcp.json <<'JSON'
          {"mcpServers":{"review_context":{"command":"python3","args":["review-context/tools/review_components.py","mcp-server","--context","review-context","--audit","review-context/retrieval-audit.jsonl"]}}}
          JSON

      - name: Run schema-constrained analysis
        id: analyze
        uses: anthropics/claude-code-action/base-action@536f2c32a39763739000b0e1ac69ca2647d97ce9 # v1.0.170
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.NVIDIA_INFERENCE_URL }}
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          DISABLE_PROMPT_CACHING: "1"
        with:
          anthropic_api_key: ${{ secrets.NVIDIA_INFERENCE_KEY }}
          show_full_output: false
          prompt_file: analysis-input/prompt.txt
          claude_args: |
            --model "${{ inputs.model }}"
            --mcp-config "analysis-input/mcp.json"
            --allowedTools "mcp__review_context__metadata,mcp__review_context__changed_files,mcp__review_context__tree,mcp__review_context__read,mcp__review_context__search,mcp__review_context__diff_hunks,mcp__review_context__history"
            --json-schema "$(cat review-context/tools/review-output-v1.schema.json)"

      - name: Validate structured result
        env:
          STRUCTURED_OUTPUT: ${{ steps.analyze.outputs.structured_output }}
        run: |
          set -euo pipefail
          printf '%s' "$STRUCTURED_OUTPUT" > review-output.json
          python3 review-context/tools/review_components.py validate-output \
            --context review-context --output review-output.json --validated-output validated-review-output.json

      - name: Name bounded result artifact
        id: names
        run: echo "result_artifact_name=${{ inputs.artifact_name }}-result" >> "$GITHUB_OUTPUT"

      - name: Upload structured result and audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.result_artifact_name }}
          path: |
            validated-review-output.json
            review-context/retrieval-audit.jsonl
          if-no-files-found: error
          retention-days: 1

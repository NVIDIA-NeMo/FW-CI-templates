name: Publish isolated review result
on:
  workflow_call:
    inputs:
      context_artifact_name:
        required: true
        type: string
      result_artifact_name:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Download immutable context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.context_artifact_name }}
          path: review-context

      - name: Download structured result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.result_artifact_name }}
          path: review-result

      - name: Validate and publish as claude[bot]
        run: |
          set -euo pipefail
          python3 review-context/tools/review_components.py publish \
            --context review-context --output review-result/validated-review-output.json

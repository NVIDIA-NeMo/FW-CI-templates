name: Run MBridge validation

on:
  workflow_call:
    inputs:
      mcore_ref:
        description: Full Megatron-LM commit SHA tested by MBridge
        required: true
        type: string
      test_suite:
        description: MBridge test suite (L1 or unit-only)
        required: true
        type: string
      poll_timeout_seconds:
        description: Maximum time to wait for the downstream workflow
        required: false
        default: 12600
        type: number
    secrets:
      BOT_ID:
        required: true
      BOT_KEY:
        required: true

permissions: {}

jobs:
  mbridge-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MBRIDGE_APP_ID: ${{ secrets.BOT_ID }}
      MBRIDGE_PRIVATE_KEY: ${{ secrets.BOT_KEY }}
      MBRIDGE_MCORE_REF: ${{ inputs.mcore_ref }}
      MBRIDGE_TEST_SUITE: ${{ inputs.test_suite }}
      MBRIDGE_POLL_TIMEOUT_SECONDS: ${{ inputs.poll_timeout_seconds }}
      MBRIDGE_ORCHESTRATOR_RUN: "1"
    steps:
      - name: Dispatch, monitor, and clean up MBridge validation
        shell: bash
        run: |
          node <<'MBRIDGE_ORCHESTRATOR'
          // Copyright (c) 2026, NVIDIA CORPORATION. All rights reserved.
          //
          // Licensed under the Apache License, Version 2.0 (the "License");
          // you may not use this file except in compliance with the License.
          // You may obtain a copy of the License at
          //
          //     http://www.apache.org/licenses/LICENSE-2.0
          //
          // Unless required by applicable law or agreed to in writing, software
          // distributed under the License is distributed on an "AS IS" BASIS,
          // WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          // See the License for the specific language governing permissions and
          // limitations under the License.

          "use strict";

          const crypto = require("node:crypto");

          const API_ROOT = "https://api.github.com";
          const TARGET_OWNER = "NVIDIA-NeMo";
          const TARGET_REPO = "Megatron-Bridge";
          const TARGET_WORKFLOW = "cicd-main.yml";
          const TARGET_BASE_REF = "main";
          const ALLOWED_CALLER = "NVIDIA/Megatron-LM";
          const ALLOWED_SUITES = new Set(["L1", "unit-only"]);
          const TOKEN_REFRESH_MARGIN_MS = 10 * 60 * 1000;
          const DISCOVERY_TIMEOUT_MS = 10 * 60 * 1000;
          const POLL_INTERVAL_MS = 60 * 1000;

          function base64Url(value) {
            return Buffer.from(value).toString("base64url");
          }

          function createAppJwt(appId, privateKey, nowMs = Date.now()) {
            const issuedAt = Math.floor(nowMs / 1000) - 60;
            const header = base64Url(JSON.stringify({ alg: "RS256", typ: "JWT" }));
            const payload = base64Url(
              JSON.stringify({ iat: issuedAt, exp: issuedAt + 9 * 60, iss: appId }),
            );
            const signingInput = `${header}.${payload}`;
            const signature = crypto.sign(
              "RSA-SHA256",
              Buffer.from(signingInput),
              privateKey,
            );
            return `${signingInput}.${signature.toString("base64url")}`;
          }

          function readConfig(env = process.env) {
            const config = {
              appId: env.MBRIDGE_APP_ID || "",
              privateKey: env.MBRIDGE_PRIVATE_KEY || "",
              mcoreRef: env.MBRIDGE_MCORE_REF || "",
              testSuite: env.MBRIDGE_TEST_SUITE || "",
              pollTimeoutSeconds: Number(env.MBRIDGE_POLL_TIMEOUT_SECONDS || "12600"),
              callerRepository: env.GITHUB_REPOSITORY || "",
              runId: env.GITHUB_RUN_ID || "",
              runAttempt: env.GITHUB_RUN_ATTEMPT || "",
              serverUrl: env.GITHUB_SERVER_URL || "https://github.com",
            };
            validateConfig(config);
            return config;
          }

          function validateConfig(config) {
            if (!/^\d+$/.test(config.appId)) {
              throw new Error("The GitHub App ID must be numeric");
            }
            if (!/-----BEGIN (?:RSA )?PRIVATE KEY-----/.test(config.privateKey)) {
              throw new Error("The GitHub App private key is missing or malformed");
            }
            if (!/^[0-9a-f]{40}$/.test(config.mcoreRef)) {
              throw new Error("mcore_ref must be a full lowercase commit SHA");
            }
            if (!ALLOWED_SUITES.has(config.testSuite)) {
              throw new Error(`Unsupported MBridge test suite: ${config.testSuite}`);
            }
            if (
              !Number.isInteger(config.pollTimeoutSeconds) ||
              config.pollTimeoutSeconds < 60 ||
              config.pollTimeoutSeconds > 4 * 60 * 60
            ) {
              throw new Error(
                "poll_timeout_seconds must be an integer between 60 and 14400",
              );
            }
            if (config.callerRepository !== ALLOWED_CALLER) {
              throw new Error(`This workflow only accepts calls from ${ALLOWED_CALLER}`);
            }
            if (!/^\d+$/.test(config.runId) || !/^\d+$/.test(config.runAttempt)) {
              throw new Error("GitHub run ID and attempt must be numeric");
            }
            if (config.serverUrl !== "https://github.com") {
              throw new Error("Only github.com callers are supported");
            }
          }

          function testingBranch(config) {
            return `mcore-testing-${config.runId}-${config.runAttempt}`;
          }

          function triggeredBy(config) {
            return `${config.serverUrl}/${config.callerRepository}/actions/runs/${config.runId}`;
          }

          async function apiRequest(token, method, path, body, fetchImpl = fetch) {
            const response = await fetchImpl(`${API_ROOT}${path}`, {
              method,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) {
              throw new Error(
                `GitHub API ${method} ${path} failed with HTTP ${response.status}: ${text.slice(0, 1000)}`,
              );
            }
            return text ? JSON.parse(text) : null;
          }

          function createTokenMinter(config, dependencies = {}) {
            const request = dependencies.apiRequest || apiRequest;
            const now = dependencies.now || Date.now;
            let installationId;

            return async function mintToken(permissions) {
              const jwt = createAppJwt(config.appId, config.privateKey, now());
              if (installationId === undefined) {
                const installation = await request(
                  jwt,
                  "GET",
                  `/repos/${TARGET_OWNER}/${TARGET_REPO}/installation`,
                );
                installationId = installation.id;
              }
              const response = await request(
                jwt,
                "POST",
                `/app/installations/${installationId}/access_tokens`,
                { repositories: [TARGET_REPO], permissions },
              );
              return {
                token: response.token,
                expiresAtMs: Date.parse(response.expires_at),
              };
            };
          }

          function runsPath(branch) {
            const query = new URLSearchParams({
              event: "workflow_dispatch",
              branch,
              per_page: "100",
            });
            return `/repos/${TARGET_OWNER}/${TARGET_REPO}/actions/workflows/${encodeURIComponent(TARGET_WORKFLOW)}/runs?${query}`;
          }

          function selectDispatchedRun(runs, oldRunIds, branch, startedAtMs) {
            return runs
              .filter(
                (run) =>
                  !oldRunIds.has(run.id) &&
                  run.event === "workflow_dispatch" &&
                  run.head_branch === branch &&
                  Date.parse(run.created_at) >= startedAtMs - 2 * 60 * 1000,
              )
              .sort(
                (left, right) =>
                  Date.parse(left.created_at) - Date.parse(right.created_at),
              )[0];
          }

          async function discoverRun(
            token,
            oldRunIds,
            branch,
            startedAtMs,
            dependencies = {},
          ) {
            const request = dependencies.apiRequest || apiRequest;
            const now = dependencies.now || Date.now;
            const sleep =
              dependencies.sleep ||
              ((milliseconds) =>
                new Promise((resolve) => setTimeout(resolve, milliseconds)));
            const deadline = now() + DISCOVERY_TIMEOUT_MS;
            while (now() < deadline) {
              const response = await request(token, "GET", runsPath(branch));
              const run = selectDispatchedRun(
                response.workflow_runs,
                oldRunIds,
                branch,
                startedAtMs,
              );
              if (run !== undefined) {
                return run.id;
              }
              await sleep(POLL_INTERVAL_MS);
            }
            throw new Error(
              "Timed out waiting for the dispatched MBridge workflow run to appear",
            );
          }

          async function pollRun(runId, timeoutSeconds, mintToken, dependencies = {}) {
            const request = dependencies.apiRequest || apiRequest;
            const now = dependencies.now || Date.now;
            const sleep =
              dependencies.sleep ||
              ((milliseconds) =>
                new Promise((resolve) => setTimeout(resolve, milliseconds)));
            const deadline = now() + timeoutSeconds * 1000;
            let credential;

            while (true) {
              if (
                credential === undefined ||
                credential.expiresAtMs - now() <= TOKEN_REFRESH_MARGIN_MS
              ) {
                credential = await mintToken({ actions: "read" });
              }
              const run = await request(
                credential.token,
                "GET",
                `/repos/${TARGET_OWNER}/${TARGET_REPO}/actions/runs/${runId}`,
              );
              console.log(
                `MBridge workflow status=${run.status} conclusion=${run.conclusion}`,
              );
              if (run.status === "completed") {
                if (run.conclusion !== "success") {
                  throw new Error(
                    `MBridge workflow ${runId} concluded with ${run.conclusion}`,
                  );
                }
                return;
              }
              const remaining = deadline - now();
              if (remaining <= 0) {
                throw new Error(
                  `Timed out waiting for MBridge workflow ${runId} to complete`,
                );
              }
              await sleep(Math.min(POLL_INTERVAL_MS, remaining));
            }
          }

          async function deleteBranch(mintToken, branch, dependencies = {}) {
            const request = dependencies.apiRequest || apiRequest;
            const credential = await mintToken({ contents: "write" });
            try {
              await request(
                credential.token,
                "DELETE",
                `/repos/${TARGET_OWNER}/${TARGET_REPO}/git/refs/heads/${encodeURIComponent(branch)}`,
              );
            } catch (error) {
              if (!String(error.message).includes("HTTP 404")) {
                throw error;
              }
            }
          }

          async function orchestrate(config, dependencies = {}) {
            const request = dependencies.apiRequest || apiRequest;
            const now = dependencies.now || Date.now;
            const mintToken =
              dependencies.mintToken || createTokenMinter(config, dependencies);
            const branch = testingBranch(config);
            let branchCreated = false;
            let failure;

            try {
              const branchCredential = await mintToken({ contents: "write" });
              const baseRef = await request(
                branchCredential.token,
                "GET",
                `/repos/${TARGET_OWNER}/${TARGET_REPO}/git/ref/heads/${TARGET_BASE_REF}`,
              );
              await request(
                branchCredential.token,
                "POST",
                `/repos/${TARGET_OWNER}/${TARGET_REPO}/git/refs`,
                {
                  ref: `refs/heads/${branch}`,
                  sha: baseRef.object.sha,
                },
              );
              branchCreated = true;
              console.log(`Created temporary MBridge branch ${branch}`);

              const triggerCredential = await mintToken({ actions: "write" });
              const priorRuns = await request(
                triggerCredential.token,
                "GET",
                runsPath(branch),
              );
              const oldRunIds = new Set(priorRuns.workflow_runs.map((run) => run.id));
              const startedAtMs = now();
              await request(
                triggerCredential.token,
                "POST",
                `/repos/${TARGET_OWNER}/${TARGET_REPO}/actions/workflows/${encodeURIComponent(TARGET_WORKFLOW)}/dispatches`,
                {
                  ref: branch,
                  inputs: {
                    mcore_ref: config.mcoreRef,
                    test_suite: config.testSuite,
                    triggered_by: triggeredBy(config),
                  },
                },
              );
              const runId = await discoverRun(
                triggerCredential.token,
                oldRunIds,
                branch,
                startedAtMs,
                dependencies,
              );
              console.log(`Discovered MBridge workflow run ${runId}`);
              await pollRun(runId, config.pollTimeoutSeconds, mintToken, dependencies);
            } catch (error) {
              failure = error;
            } finally {
              if (branchCreated) {
                try {
                  await deleteBranch(mintToken, branch, dependencies);
                  console.log(`Deleted temporary MBridge branch ${branch}`);
                } catch (cleanupError) {
                  if (failure === undefined) {
                    failure = cleanupError;
                  } else {
                    console.error(
                      `MBridge branch cleanup also failed: ${cleanupError.message}`,
                    );
                  }
                }
              }
            }

            if (failure !== undefined) {
              throw failure;
            }
          }

          async function main() {
            await orchestrate(readConfig());
          }

          module.exports = {
            createAppJwt,
            createTokenMinter,
            discoverRun,
            orchestrate,
            pollRun,
            readConfig,
            runsPath,
            selectDispatchedRun,
            testingBranch,
            triggeredBy,
            validateConfig,
          };

          if (process.env.MBRIDGE_ORCHESTRATOR_RUN === "1") {
            main().catch((error) => {
              console.error(error.stack || error.message);
              process.exitCode = 1;
            });
          }
          MBRIDGE_ORCHESTRATOR

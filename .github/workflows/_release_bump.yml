name: "Release: bump version(s)"

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

on:
  workflow_call:
    inputs:
      release-ref:
        required: true
        description: Ref (SHA or branch) to release
        type: string
      validate-only:
        type: boolean
        required: false
        default: false
        description: Inert mode for per-PR rehearsals. Compute the bump and assert release preconditions; do not push, open a PR, or merge.
      dry-run:
        type: boolean
        required: false
        default: false
        description: Inert mode for workflow_dispatch rehearsals. Same precondition checks as validate-only; no side effects on the repo.
      version-bump-branch:
        type: string
        required: false
        default: main
        description: Branch to merge the bump commit into.
      skip-version-bump:
        type: boolean
        required: false
        default: false
        description: Skip the bump entirely (for dynamic versioning).
      restrict-to-admins:
        type: boolean
        required: false
        default: true
        description: Only repository admins may invoke. Always skipped under validate-only.
      release-branch-pattern:
        type: string
        required: false
        default: "[rv][0-9].[0-9].[0-9]"
        description: |
          Branch-protection pattern of the real release branches. In inert mode
          (validate-only or dry-run) the workflow asserts a rule for this pattern
          exists with `isAdminEnforced=false`. Real releases push through that rule
          via admin bypass, so this precondition is what makes the push succeed.
      app-id:
        type: string
        required: false
        description: GitHub App ID used to mint the bot token for git push and PR creation.
      release-environment:
        type: string
        required: false
        description: Environment with RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY. Production opens a version bump PR for normal review; rehearsals use the job token.
      library-name:
        type: string
        required: true
        description: Human-readable library name used in the bump PR title.
      bump-targets:
        type: string
        required: false
        default: ""
        description: |
          JSON array of bump targets, each `{"python-package": "...", "src-dir": "..."}`.
          Empty falls back to a single target derived from python-package + has-src-dir.
          The first target's current version becomes the release-version output.
      python-package:
        type: string
        required: false
        default: ""
        description: Single-target back-compat — ignored when bump-targets is non-empty.
      has-src-dir:
        type: boolean
        required: false
        default: false
        description: Single-target back-compat — ignored when bump-targets is non-empty.
      packaging:
        type: string
        required: false
        default: setuptools
        description: "Packaging tool (supported: setuptools, uv)."
      root-dir:
        type: string
        required: false
        default: "./"
        description: Sub-directory containing the package source(s).
    secrets:
      BOT_KEY:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      release-version:
        description: The version being released (current version of the first bump target, before the bump).
        value: ${{ jobs.bump-next-version.outputs.release-version }}

permissions:
  contents: read

jobs:
  check-admin-permission:
    runs-on: ubuntu-latest
    if: inputs.restrict-to-admins == true
    env:
      VALIDATE_ONLY: ${{ inputs.validate-only }}
    steps:
      - name: Check if user has admin permission
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: permissionLevel } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            const permission = permissionLevel.permission;
            const validateOnly = process.env.VALIDATE_ONLY === 'true';
            console.log(`User ${context.actor} has permission: ${permission}`);

            if (permission !== 'admin') {
              const msg = `User ${context.actor} does not have admin permission (has: ${permission}). Only admins can release.`;
              if (validateOnly) {
                core.notice(`[validate-only] ${msg} — would block real release.`);
              } else {
                core.setFailed(msg);
              }
            }

  bump-next-version:
    runs-on: ubuntu-latest
    environment:
      name: ${{ (inputs.validate-only || (inputs.release-environment != '' && inputs.dry-run)) && 'public' || inputs.release-environment || 'main' }}
      deployment: false
    needs: [check-admin-permission]
    if: |
      !inputs.skip-version-bump
      && (
        success() || !failure()
      )
      && !cancelled()
    outputs:
      release-version: ${{ steps.bump.outputs.release-version }}
      next-version: ${{ steps.bump.outputs.next-version }}
    env:
      IS_INERT: ${{ inputs.validate-only || inputs.dry-run }}
      PACKAGING: ${{ inputs.packaging }}
      BUMP_TARGETS: ${{ inputs.bump-targets }}
      ROOT_DIR: ${{ inputs.root-dir }}
      FALLBACK_PYPROJECT_NAME: ${{ inputs.python-package }}
      FALLBACK_SRC_DIR: ${{ inputs.has-src-dir && 'src/' || '' }}
    steps:
      - name: Create caller-supplied App token
        if: inputs.release-environment == ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.BOT_KEY }}

      - name: Create protected release token
        if: inputs.release-environment != '' && env.IS_INERT == 'false'
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read

      - name: Verify protected release source and destination
        if: inputs.release-environment != '' && env.IS_INERT == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_SHA: ${{ inputs.release-ref }}
          BUMP_BRANCH: ${{ inputs.version-bump-branch }}
          RELEASE_PATTERN: ${{ inputs.release-branch-pattern }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_QUERY: >-
            query($owner:String!, $name:String!, $ref:String!) {
              repository(owner:$owner, name:$name) {
                ref(qualifiedName:$ref) {
                  target { oid }
                  branchProtectionRule { pattern restrictsPushes blocksCreations requiresApprovingReviews requiresCodeOwnerReviews }
                }
              }
            }
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch production releases from the default branch with a full commit SHA."
            exit 1
          fi
          branch=$(gh api graphql -f query="$BRANCH_QUERY" -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="${GITHUB_REPOSITORY#*/}" -f ref="refs/heads/$BUMP_BRANCH" --jq '.data.repository.ref')
          tip=$(jq -er --arg branch "$BUMP_BRANCH" --arg default "$DEFAULT_BRANCH" --arg pattern "$RELEASE_PATTERN" '
            select(.branchProtectionRule | .requiresApprovingReviews and .requiresCodeOwnerReviews and
              (if $branch == $default then .pattern == $default else .pattern == $pattern and .restrictsPushes and .blocksCreations end)) |
            .target.oid' <<< "$branch")
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$tip" --jq '.status')
          if [[ "$comparison" != identical && "$comparison" != ahead ]]; then
            echo "::error::The release SHA must be on the authorized version bump branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: ${{ github.run_id }}
          token: ${{ steps.release-token.outputs.token || steps.app-token.outputs.token || github.token }}
          persist-credentials: ${{ !inputs.validate-only && !inputs.dry-run }}
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.release-ref }}

      - name: Bump version(s)
        id: bump
        run: |
          cd -- "$GITHUB_RUN_ID"
          cd -- "$ROOT_DIR"

          # Resolve bump targets. JSON array if provided, else single fallback.
          if [[ -n "$BUMP_TARGETS" ]]; then
            TARGETS_JSON="$BUMP_TARGETS"
          else
            TARGETS_JSON=$(jq -nc \
              --arg pkg "$FALLBACK_PYPROJECT_NAME" \
              --arg src "$FALLBACK_SRC_DIR" \
              '[{"python-package": $pkg, "src-dir": $src}]')
          fi

          echo "Resolved targets: $TARGETS_JSON"

          RELEASE_VERSION=""
          NEXT_VERSION=""
          BUMPED_FILES=()

          while IFS= read -r TGT; do
            PYPROJECT_NAME=$(echo "$TGT" | jq -r '."python-package"')
            SRC_DIR=$(echo "$TGT" | jq -r '."src-dir"')
            PACKAGE_INFO_FILE="${SRC_DIR}${PYPROJECT_NAME//.//}/package_info.py"

            echo "Bumping $PYPROJECT_NAME at $PACKAGE_INFO_FILE"

            if [[ "$PACKAGING" == "setuptools" || "$PACKAGING" == "uv" ]]; then
              MAJOR=$(awk -F'= ' '/^MAJOR = / {print $2}' < "$PACKAGE_INFO_FILE")
              MINOR=$(awk -F'= ' '/^MINOR = / {print $2}' < "$PACKAGE_INFO_FILE")
              PATCH=$(awk -F'= ' '/^PATCH = / {print $2}' < "$PACKAGE_INFO_FILE")
              PRERELEASE=$(awk -F'= ' '/^PRE_RELEASE = / {print $2}' < "$PACKAGE_INFO_FILE" | tr -d '"' | tr -d "'")

              if [[ ! "$MAJOR" =~ ^(0|[1-9][0-9]*)$ || ! "$MINOR" =~ ^(0|[1-9][0-9]*)$ || ! "$PATCH" =~ ^(0|[1-9][0-9]*)$ ||
                    ( -n "$PRERELEASE" && ! "$PRERELEASE" =~ ^(rc|a)(0|[1-9][0-9]*)$ ) ]]; then
                echo "::error::Invalid numeric version or pre-release suffix in $PACKAGE_INFO_FILE"
                exit 1
              fi
              CURRENT_VERSION="$MAJOR.$MINOR.$PATCH$PRERELEASE"

              if [[ "$PRERELEASE" != "" ]]; then
                if [[ "$PRERELEASE" == *rc* ]]; then
                  NEXT_PATCH=$PATCH
                  NEXT_PRERELEASE=rc$((${PRERELEASE#rc} + 1))
                elif [[ "$PRERELEASE" == *a* ]]; then
                  NEXT_PATCH=$PATCH
                  NEXT_PRERELEASE=a$((${PRERELEASE#a} + 1))
                else
                  echo "Unknown pre-release: $PRERELEASE"
                  exit 1
                fi
              else
                NEXT_PATCH=$((PATCH + 1))
                NEXT_PRERELEASE=$PRERELEASE
              fi

              sed -i "/^PATCH/c\PATCH = $NEXT_PATCH" -- "$PACKAGE_INFO_FILE"
              sed -i "/^PRE_RELEASE/c\PRE_RELEASE = \"$NEXT_PRERELEASE\"" -- "$PACKAGE_INFO_FILE"
              BUMPED_FILES+=("$PACKAGE_INFO_FILE")

              TARGET_NEXT="$MAJOR.$MINOR.$NEXT_PATCH$NEXT_PRERELEASE"
            else
              echo "Unsupported packaging: $PACKAGING"
              exit 1
            fi

            echo "  $PYPROJECT_NAME: $CURRENT_VERSION -> $TARGET_NEXT"

            if [[ -z "$RELEASE_VERSION" ]]; then
              RELEASE_VERSION="$CURRENT_VERSION"
              NEXT_VERSION="$TARGET_NEXT"
            fi
          done < <(echo "$TARGETS_JSON" | jq -c '.[]')

          echo "release-version=$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "next-version=$NEXT_VERSION" | tee -a "$GITHUB_OUTPUT"
          printf '%s\0' "${BUMPED_FILES[@]}" > "$RUNNER_TEMP/bumped-files"

      - name: Record computed versions
        if: env.IS_INERT == 'true'
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.release-version }}
          NEXT_VERSION: ${{ steps.bump.outputs.next-version }}
        run: |
          {
            echo "## Bump rehearsal"
            echo
            printf -- '- release-version (current): %s\n- next-version (after bump): %s\n' "$RELEASE_VERSION" "$NEXT_VERSION"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate release config
        if: env.IS_INERT == 'true' && inputs.release-environment == ''
        shell: bash
        env:
          APP_ID: ${{ inputs.app-id }}
          BOT_KEY: ${{ secrets.BOT_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_PATTERN: ${{ inputs.release-branch-pattern }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          QUERY: >-
            query($owner:String!, $repo:String!) { repository(owner:$owner, name:$repo) {
              branchProtectionRules(first: 100) { nodes { pattern isAdminEnforced } }
            } }
        run: |
          set -euo pipefail
          # Assert the preconditions a real release relies on, without side effects.
          #
          # Two reads, no writes:
          #   1. GET /repos/{owner}/{repo}/installation — needs a JWT signed by
          #      the App's private key (the installation token is not enough for
          #      this endpoint). Asserts contents:write, pull_requests:write,
          #      administration:read are still granted to the installation.
          #   2. branchProtectionRules GraphQL — uses the installation token.
          #      Asserts a rule for `release-branch-pattern` exists with
          #      isAdminEnforced=false. Real releases push through that rule
          #      via admin bypass.

          # Mint a 5-minute App JWT from BOT_KEY using openssl.
          PEM_FILE=$(mktemp)
          trap 'rm -f "$PEM_FILE"' EXIT
          printf '%s' "$BOT_KEY" > "$PEM_FILE"

          b64url() { openssl base64 -A | tr -d '=' | tr '/+' '_-'; }
          NOW=$(date +%s)
          HEADER=$(printf '{"typ":"JWT","alg":"RS256"}' | b64url)
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW - 60))" "$((NOW + 300))" "$APP_ID" | b64url)
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -binary -sign "$PEM_FILE" | b64url)
          JWT="${HEADER}.${PAYLOAD}.${SIG}"

          # 1. App installation permissions on this repo.
          PERMS=$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/installation" \
            | jq -c '.permissions')

          CONTENTS=$(echo "$PERMS" | jq -r '.contents // "missing"')
          PR_PERM=$(echo "$PERMS" | jq -r '.pull_requests // "missing"')
          ADMIN_PERM=$(echo "$PERMS" | jq -r '.administration // "missing"')

          MISSING=""
          [[ "$CONTENTS"   == "write" ]] || MISSING="$MISSING contents=write(actual=$CONTENTS)"
          [[ "$PR_PERM"    == "write" ]] || MISSING="$MISSING pull_requests=write(actual=$PR_PERM)"
          [[ "$ADMIN_PERM" == "read" || "$ADMIN_PERM" == "write" ]] || MISSING="$MISSING administration=read(actual=$ADMIN_PERM)"

          if [[ -n "$MISSING" ]]; then
            echo "::error::App installation is missing required permissions:$MISSING"
            exit 1
          fi
          echo "App installation permissions OK: $PERMS"

          # 2. Source release-branch rule has admin enforcement off.
          BODY=$(jq -nc --arg q "$QUERY" --arg owner "$OWNER" --arg repo "$REPO" '{query: $q, variables: {owner: $owner, repo: $repo}}')
          RESPONSE=$(curl --silent --show-error --fail \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -X POST -d "$BODY" \
            "https://api.github.com/graphql")

          if [[ "$(echo "$RESPONSE" | jq 'has("errors")')" == "true" ]]; then
            echo "::error::GraphQL errors: $(echo "$RESPONSE" | jq -c '.errors')"
            exit 1
          fi

          SOURCE=$(echo "$RESPONSE" | jq -c --arg p "$SOURCE_PATTERN" '.data.repository.branchProtectionRules.nodes[] | select(.pattern == $p)')
          if [[ -z "$SOURCE" ]]; then
            echo "::warning::No branch protection rule found for pattern '$SOURCE_PATTERN'. Real releases won't be gated by a release-branch rule; skipping the admin-bypass check. Override release-branch-pattern if this repo has its own convention."
          elif [[ "$(echo "$SOURCE" | jq -r '.isAdminEnforced')" == "true" ]]; then
            echo "::error::Source rule '$SOURCE_PATTERN' has isAdminEnforced=true. Real releases push through admin bypass; set isAdminEnforced=false."
            exit 1
          else
            echo "Source rule '$SOURCE_PATTERN' OK: isAdminEnforced=false"
          fi

      - name: Resolve version-bump-branch
        if: env.IS_INERT == 'false'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || steps.app-token.outputs.token }}
          INPUT_BRANCH: ${{ inputs.version-bump-branch }}
        run: |
          # Consumers that fall back to `github.ref_name` get a PR-derived ref
          # that is not the branch a real release would target:
          #   - `<pr-num>/merge` or `<pr-num>/head` on `pull_request` triggers,
          #   - `pull-request/<pr-num>` on `push` triggers via the copy-pr-bot mirror.
          # In all those cases, fall back to the repo's default branch.
          BRANCH="$INPUT_BRANCH"
          if [[ "$BRANCH" =~ ^[0-9]+/(merge|head)$ ]] || [[ "$BRANCH" =~ ^pull-request/[0-9]+$ ]]; then
            BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
            echo "::warning::version-bump-branch resolved to PR-derived ref '$INPUT_BRANCH'; falling back to default branch '$BRANCH'."
          fi
          if [[ "$BRANCH" == -* ]] || ! git check-ref-format "refs/heads/$BRANCH"; then
            echo "::error::version-bump-branch must be a valid branch name."
            exit 1
          fi
          printf 'VERSION_BUMP_BRANCH=%s\n' "$BRANCH" | tee -a "$GITHUB_ENV"

      - name: Create and push deployment branch
        if: env.IS_INERT == 'false'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || steps.app-token.outputs.token }}
          BUMP_BRANCH_PREFIX: ${{ inputs.release-environment != '' && 'release-bump' || 'deploy-release' }}
          BUMP_TITLE: "beep boop 🤖: Bumping ${{ inputs.library-name }} to v${{ steps.bump.outputs.next-version }}"
          BUMP_BODY: "This is an automated PR to bump ${{ inputs.library-name }} to v${{ steps.bump.outputs.next-version }}."
          CI_SKIP_SUFFIX: ${{ inputs.release-environment == '' && ' [skip ci]' || '' }}
        run: |
          cd -- "$GITHUB_RUN_ID"
          cd -- "$ROOT_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TMP_BRANCH="$BUMP_BRANCH_PREFIX/$(uuidgen)"
          git checkout -b "$TMP_BRANCH"
          while IFS= read -r -d '' f; do
            [[ -n "$f" ]] && git --literal-pathspecs add -- "$f"
          done < "$RUNNER_TEMP/bumped-files"

          git commit -s -m "$BUMP_TITLE$CI_SKIP_SUFFIX" || echo "No changes to commit"
          git push -u origin "$TMP_BRANCH"
          echo "TMP_BRANCH=$TMP_BRANCH" | tee -a "$GITHUB_ENV"

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$VERSION_BUMP_BRANCH" \
            --head "$TMP_BRANCH" \
            --title "$BUMP_TITLE" \
            --body "$BUMP_BODY")
          PR_NUMBER="${PR_URL##*/}"
          echo "PR_NUMBER=$PR_NUMBER" | tee -a "$GITHUB_ENV"
          echo "Version bump pull request: $PR_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Merge deploy-release branch into target
        if: env.IS_INERT == 'false' && inputs.release-environment == ''
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || steps.app-token.outputs.token }}
        run: |
          cd -- "$GITHUB_RUN_ID"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Direct git push to the protected version-bump-branch. The source rule
          # has `isAdminEnforced=false` (asserted in inert mode by `Validate
          # release config`), so the bot bypasses required checks and approving-
          # review counts as a repo admin.
          git fetch origin "$VERSION_BUMP_BRANCH"
          git checkout "$VERSION_BUMP_BRANCH"
          git merge "$TMP_BRANCH"

          for attempt in {1..3}; do
            if git push origin "$VERSION_BUMP_BRANCH"; then
              echo "Git push to $VERSION_BUMP_BRANCH succeeded on attempt $attempt"
              break
            else
              echo "Git push to $VERSION_BUMP_BRANCH failed on attempt $attempt"
              if [[ $attempt -lt 3 ]]; then
                sleep $((RANDOM % 3 + 1))
                git fetch origin "$VERSION_BUMP_BRANCH"
                git reset --hard "origin/$VERSION_BUMP_BRANCH"
                git merge "$TMP_BRANCH"
              else
                echo "Git push to $VERSION_BUMP_BRANCH failed after 3 attempts"
                exit 1
              fi
            fi
          done

      - name: Delete temporary branch
        if: always() && env.IS_INERT == 'false' && inputs.release-environment == ''
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || steps.app-token.outputs.token }}
        run: |
          cd -- "$GITHUB_RUN_ID"
          if [[ -n "${TMP_BRANCH:-}" ]]; then
            git push -d origin "$TMP_BRANCH" || true
          fi

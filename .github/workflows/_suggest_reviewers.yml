#
# Requests reviewers on a PR based on `# suggest:` comment lines in the
# calling repo's .github/CODEOWNERS. Advisory only: GitHub's own CODEOWNERS
# parser ignores comment lines, so a `# suggest:` entry can never become a
# required reviewer no matter what branch protection does — only the real,
# non-comment CODEOWNERS lines are enforced.
#
# Skips a suggested owner that's textually identical to an already-enforced
# owner for the same file — see .github/scripts/codeowners-suggestions.js for
# the "last match wins" resolution logic and its own unit tests. The actual
# glob-matching (does file X match pattern Y) is delegated to
# step-security/changed-files, already trusted elsewhere in this repo
# (_cicd_preflight.yml, _copyright_check.yml) — this workflow only converts
# CODEOWNERS patterns to the glob syntax it expects and resolves precedence
# across whichever groups it reports as matched.

on:
  workflow_call:
    inputs:
      workflow_ref:
        description: "Ref of this repo (FW-CI-templates) to check out for shared scripts/actions"
        required: false
        default: main
        type: string
      app-id:
        description: >
          GitHub App ID to mint a short-lived, org-scoped token for team-reviewer
          resolution (listing team membership, requesting a team as a PR
          reviewer). Preferred over TEAM_REVIEWER_PAT when both are provided.
          Needs "Pull requests: Read and write" + org "Members: Read-only".
        required: false
        default: ""
        type: string
    secrets:
      BOT_KEY:
        description: "Private key for the App identified by app-id."
        required: false
      TEAM_REVIEWER_PAT:
        description: >
          Fallback PAT for team-reviewer resolution when app-id isn't provided.
          Optional: without either, individual-user suggestions still work fine
          on the default token; team suggestions are skipped with a warning.
          Least-privilege scope: fine-grained PAT, repo access limited to the
          calling repo, "Pull requests: Read and write" + org "Members:
          Read-only". Classic PAT equivalent: public_repo + read:org.
        required: false
      SLACK_TEAM_CHANNEL_WEBHOOK:
        description: "Slack webhook to alert on if the reviewer-request batch call fails. Optional: skips the alert if absent."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest-reviewers:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # step-security/changed-files needs a real git diff, not just the
      # CODEOWNERS file -- fetch-depth: 0 is a heavier checkout than this
      # workflow used to need (previously just sparse-checked-out CODEOWNERS
      # and asked the API for the changed-file list). Worth knowing on a very
      # large repo; needed for the glob-matching handoff below.
      - name: Checkout calling repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Checkout NVIDIA-NeMo/FW-CI-templates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NVIDIA-NeMo/FW-CI-templates
          ref: ${{ inputs.workflow_ref }}
          path: ci-templates

      # Turns every CODEOWNERS rule (enforced and `# suggest:` alike) into its
      # own named glob group for the next step to test against the PR's actual
      # changed files. Group names are synthetic (e0, e1, ... for enforced
      # rules; s0, s1, ... for suggest rules, by array index) since files_yaml
      # groups are keyed by string -- group_meta is the map back from each
      # synthetic name to its real pattern + owners.
      - name: Build glob groups from CODEOWNERS
        id: build-groups
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const { parseCodeowners, toGlob } = require('./ci-templates/.github/scripts/codeowners-suggestions.js');

            const codeownersPath = '.github/CODEOWNERS';
            if (!fs.existsSync(codeownersPath)) {
              core.info(`${codeownersPath} not found, skipping.`);
              core.setOutput('has_rules', 'false');
              return;
            }

            const { enforcedRules, suggestRules } = parseCodeowners(fs.readFileSync(codeownersPath, 'utf8'));
            if (suggestRules.length === 0) {
              core.info('No `# suggest:` lines found in CODEOWNERS, skipping.');
              core.setOutput('has_rules', 'false');
              return;
            }

            const lines = [];
            const groupMeta = {};
            function addGroup(prefix, index, rule) {
              const name = `${prefix}${index}`;
              groupMeta[name] = { pattern: rule.pattern, owners: rule.owners };
              lines.push(`${name}:`);
              for (const glob of toGlob(rule.pattern)) {
                lines.push(`  - ${JSON.stringify(glob)}`);
              }
            }
            enforcedRules.forEach((rule, i) => addGroup('e', i, rule));
            suggestRules.forEach((rule, i) => addGroup('s', i, rule));

            core.setOutput('has_rules', 'true');
            core.setOutput('files_yaml', lines.join('\n'));
            core.setOutput('group_meta', JSON.stringify(groupMeta));
            core.setOutput('enforced_count', String(enforcedRules.length));
            core.setOutput('suggest_count', String(suggestRules.length));

      # The actual "does file X match pattern Y" glob test, delegated entirely
      # to this already-trusted-elsewhere-in-this-repo action instead of a
      # hand-rolled regex engine. json: true so file lists come back as real
      # JSON arrays (safe with filenames containing spaces) instead of a
      # separator-joined string we'd have to split ourselves.
      - name: Detect which CODEOWNERS rules matched the changed files
        if: steps.build-groups.outputs.has_rules == 'true'
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.event.pull_request.head.sha }}
          files_yaml: ${{ steps.build-groups.outputs.files_yaml }}
          json: true

      # Resolves suggested reviewers and requests individual-user ones directly
      # (default GITHUB_TOKEN is sufficient for that). If a TEAM is among the
      # suggestions, this step does NOT request it -- team-reviewer resolution
      # needs a token tied to a real identity (App or PAT), which the default
      # token isn't. Instead it hands off the resolved lists to the next step,
      # which runs only when needed and uses that elevated token for its
      # *entire* scope (see that step for why that's deliberate).
      - name: Resolve suggested reviewers from CODEOWNERS `# suggest:` lines
        if: steps.build-groups.outputs.has_rules == 'true'
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { resolveLastMatchPerFile } = require('./ci-templates/.github/scripts/codeowners-suggestions.js');

            const groupMeta = JSON.parse(`${{ steps.build-groups.outputs.group_meta }}`);
            const enforcedCount = Number(`${{ steps.build-groups.outputs.enforced_count }}`);
            const suggestCount = Number(`${{ steps.build-groups.outputs.suggest_count }}`);
            // toJSON() serializes the WHOLE outputs object regardless of how many
            // dynamically-named (e0, e1, ... / s0, s1, ...) keys it has -- a fixed
            // number of individual `${{ steps.x.outputs.NAME }}` references isn't
            // possible here since the rule count is data-driven from CODEOWNERS,
            // not known when this workflow file is authored.
            const changedFilesOutputs = JSON.parse(`${{ toJSON(steps.changed-files.outputs) }}`);

            function buildRulesWithMatches(prefix, count) {
              const rules = [];
              for (let i = 0; i < count; i++) {
                const name = `${prefix}${i}`;
                const meta = groupMeta[name];
                const raw = changedFilesOutputs[`${name}_all_changed_files`];
                const matchedFiles = raw ? JSON.parse(raw) : [];
                rules.push({ pattern: meta.pattern, owners: meta.owners, matchedFiles });
              }
              return rules;
            }

            const suggestWinnerByFile = resolveLastMatchPerFile(buildRulesWithMatches('s', suggestCount));
            const enforcedWinnerByFile = resolveLastMatchPerFile(buildRulesWithMatches('e', enforcedCount));

            const suggested = new Set();
            const enforcedOwners = new Set();
            for (const rule of suggestWinnerByFile.values()) rule.owners.forEach(o => suggested.add(o));
            for (const rule of enforcedWinnerByFile.values()) rule.owners.forEach(o => enforcedOwners.add(o));

            // Case: a `# suggest:` owner is textually identical to an already-enforced
            // owner for a file in this PR. GitHub already auto-requests the enforced
            // owner from the real CODEOWNERS line, so suggesting them again is a pure
            // duplicate — drop them before we ever build the reviewer lists.
            for (const owner of enforcedOwners) suggested.delete(owner);

            // GitHub logins/mentions are case-insensitive; compare lowercased so a
            // casing mismatch between CODEOWNERS and the PR author's login can't slip
            // the author into their own reviewer batch.
            const prAuthor = context.payload.pull_request.user.login;
            const prAuthorLower = prAuthor.toLowerCase();

            const reviewers = [];
            const teamReviewers = [];
            for (const owner of suggested) {
              const name = owner.replace(/^@/, '');
              if (name.includes('/')) {
                teamReviewers.push(name.split('/')[1]);
              } else if (name.toLowerCase() !== prAuthorLower) {
                reviewers.push(name);
              }
            }

            if (reviewers.length === 0 && teamReviewers.length === 0) {
              core.info('No suggested reviewers matched the changed files.');
              return;
            }

            // Already-requested/already-reviewed users cause a 422; drop anyone already
            // in either state so a re-run (e.g. on `synchronize`) doesn't fail the job.
            // Both of these are ordinary per-PR reads -- fine on the default token.
            const [{ data: existingReviewRequests }, { data: existingReviews }] = await Promise.all([
              github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
              github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
            ]);
            // A review's `user` can be null (deleted/ghost GitHub account) per
            // GitHub's own API schema — filter those out rather than crash.
            const alreadyUsers = new Set([
              ...existingReviewRequests.users.map(u => u.login),
              ...existingReviews.filter(r => r.user).map(r => r.user.login),
            ]);
            const alreadyTeams = new Set(existingReviewRequests.teams.map(t => t.slug));

            const newReviewers = reviewers.filter(r => !alreadyUsers.has(r));
            const newTeamReviewers = teamReviewers.filter(t => !alreadyTeams.has(t));

            if (newReviewers.length === 0 && newTeamReviewers.length === 0) {
              core.info('Suggested reviewers already requested or already reviewed, nothing to do.');
              return;
            }

            if (newTeamReviewers.length === 0) {
              // No team involved -- request the individuals directly, right here, on
              // the plain default token. No need to hand off to the elevated step.
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  reviewers: newReviewers,
                  team_reviewers: [],
                });
              } catch (err) {
                core.warning(`Could not request suggested reviewers: ${err.message}`);
                const attempted = newReviewers.map(r => '@' + r).join(', ');
                const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                core.setOutput('failure_message', `suggest-reviewers could not request suggested reviewers on ${context.payload.pull_request.html_url}\n` +
                  `Attempted: ${attempted}\nError: ${err.message}\nWorkflow: ${runUrl}`);
                core.setOutput('should_alert_slack', 'true');
              }
              return;
            }

            // A team is involved -- hand off to the elevated-token step.
            core.setOutput('needs_team_step', 'true');
            core.setOutput('reviewers', JSON.stringify(newReviewers));
            core.setOutput('team_reviewers', JSON.stringify(newTeamReviewers));

      # create-github-app-token defaults to a token scoped to just the current repo
      # -- team resolution needs org-level context, so explicitly set `owner:` to
      # mint an org-installation-scoped token instead. permission-members: read is
      # required even just to request a team as a reviewer (not only to list its
      # members), confirmed via a real, merged fix elsewhere:
      # https://github.com/cypress-io/cypress/pull/34249
      - name: Create org-scoped GitHub App token for team-reviewer request
        if: steps.resolve.outputs.needs_team_step == 'true' && inputs.app-id != ''
        id: org-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.BOT_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read
          permission-pull-requests: write

      # Deliberately isolated into its own step, whose ONLY job is "handle the team
      # reviewer": this is what lets it safely use the plain, official `github-token:`
      # input instead of a per-call credential override. `github-token:` swaps the
      # auth for this step's ENTIRE `github` client -- fine here, since nothing
      # low-privilege shares this step with it. (A per-call header override on a
      # client that's already authenticated some other way is a different, unreliable
      # pattern -- it silently didn't take effect in earlier testing; see commit
      # history.) Requesting a TEAM as a reviewer needs this: the default
      # GITHUB_TOKEN can't do it, regardless of permissions.
      - name: Request suggested reviewers including team
        if: steps.resolve.outputs.needs_team_step == 'true'
        id: request-team
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.org-app-token.outputs.token || secrets.TEAM_REVIEWER_PAT }}
          script: |
            const reviewers = JSON.parse(`${{ steps.resolve.outputs.reviewers }}`);
            const teamReviewers = JSON.parse(`${{ steps.resolve.outputs.team_reviewers }}`);

            // Single batch call: GitHub validates the whole payload atomically, so one
            // invalid entry (no repo access, etc.) fails the entire request. That's an
            // advisory feature breaking silently, not a CI failure — so on error we warn
            // and surface it for a Slack alert (next step), but never fail the workflow.
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers,
                team_reviewers: teamReviewers,
              });
            } catch (err) {
              core.warning(`Could not request suggested reviewers: ${err.message}`);
              const attempted = [...reviewers.map(r => '@' + r), ...teamReviewers.map(t => '@' + t)].join(', ') || '(none)';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              core.setOutput('failure_message', `suggest-reviewers could not request suggested reviewers on ${context.payload.pull_request.html_url}\n` +
                `Attempted: ${attempted}\nError: ${err.message}\nWorkflow: ${runUrl}`);
              core.setOutput('should_alert_slack', 'true');
            }

      - name: Alert Slack on request failure
        if: steps.resolve.outputs.should_alert_slack == 'true' || steps.request-team.outputs.should_alert_slack == 'true'
        uses: ./ci-templates/.github/actions/send-slack-alert
        with:
          message: ${{ steps.resolve.outputs.failure_message || steps.request-team.outputs.failure_message }}
          webhook: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}

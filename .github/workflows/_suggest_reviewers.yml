#
# Requests reviewers on a PR based on `# suggest:` comment lines in the
# calling repo's .github/CODEOWNERS. Advisory only: GitHub's own CODEOWNERS
# parser ignores comment lines, so a `# suggest:` entry can never become a
# required reviewer no matter what branch protection does — only the real,
# non-comment CODEOWNERS lines are enforced.
#
# Skips a suggested owner that's already covered by enforcement for the same
# file (either textually identical, or an individual already on an enforced
# team) — see .github/scripts/codeowners-suggestions.js for the matching
# logic and its own unit tests.

on:
  workflow_call:
    inputs:
      workflow_ref:
        description: "Ref of this repo (FW-CI-templates) to check out for shared scripts/actions"
        required: false
        default: main
        type: string
      app-id:
        description: >
          GitHub App ID to mint a short-lived, org-scoped token for team-reviewer
          resolution (listing team membership, requesting a team as a PR
          reviewer). Preferred over TEAM_REVIEWER_PAT when both are provided.
          Needs "Pull requests: Read and write" + org "Members: Read-only".
        required: false
        default: ""
        type: string
    secrets:
      BOT_KEY:
        description: "Private key for the App identified by app-id."
        required: false
      TEAM_REVIEWER_PAT:
        description: >
          Fallback PAT for team-reviewer resolution when app-id isn't provided.
          Optional: without either, individual-user suggestions still work fine
          on the default token; team suggestions are skipped with a warning.
          Least-privilege scope: fine-grained PAT, repo access limited to the
          calling repo, "Pull requests: Read and write" + org "Members:
          Read-only". Classic PAT equivalent: public_repo + read:org.
        required: false
      SLACK_TEAM_CHANNEL_WEBHOOK:
        description: "Slack webhook to alert on if the reviewer-request batch call fails. Optional: skips the alert if absent."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest-reviewers:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            .github/CODEOWNERS
          sparse-checkout-cone-mode: false

      - name: Checkout NVIDIA-NeMo/FW-CI-templates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NVIDIA-NeMo/FW-CI-templates
          ref: ${{ inputs.workflow_ref }}
          path: ci-templates

      # create-github-app-token defaults to a token scoped to just the current repo
      # -- org membership/team data is an ORG-level resource, so explicitly set
      # `owner:` to mint an org-installation-scoped token instead.
      - name: Create org-scoped GitHub App token for team lookups and requests
        if: inputs.app-id != ''
        id: org-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.BOT_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read
          permission-pull-requests: write

      # Team-reviewer resolution (listing a team's members, and requesting a team
      # as a PR reviewer) does not work with the default GITHUB_TOKEN. It DOES
      # work with a properly-permissioned GitHub App token or a PAT -- earlier
      # live testing that seemed to rule out App tokens was actually hitting a
      # separate bug (see the fetch() comment below), not a real App limitation.
      # Individual-user suggestions never need either -- they use the default
      # GITHUB_TOKEN via the else-branches below.
      - name: Request suggested reviewers from CODEOWNERS `# suggest:` lines
        id: suggest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TEAM_TOKEN: ${{ steps.org-app-token.outputs.token || secrets.TEAM_REVIEWER_PAT }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}
        with:
          script: |
            const fs = require('fs');
            const {
              parseCodeowners,
              compileRules,
              resolveWinningRule,
            } = require('./ci-templates/.github/scripts/codeowners-suggestions.js');

            const codeownersPath = '.github/CODEOWNERS';
            if (!fs.existsSync(codeownersPath)) {
              core.info(`${codeownersPath} not found, skipping.`);
              return;
            }

            const { enforcedRules, suggestRules } = parseCodeowners(fs.readFileSync(codeownersPath, 'utf8'));
            if (suggestRules.length === 0) {
              core.info('No `# suggest:` lines found in CODEOWNERS, skipping.');
              return;
            }

            const compiledSuggest = compileRules(suggestRules);
            const compiledEnforced = compileRules(enforcedRules);

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const suggested = new Set();
            const enforcedOwners = new Set();
            for (const file of files) {
              const suggestMatch = resolveWinningRule(compiledSuggest, file.filename);
              if (suggestMatch) suggestMatch.owners.forEach(o => suggested.add(o));

              const enforcedMatch = resolveWinningRule(compiledEnforced, file.filename);
              if (enforcedMatch) enforcedMatch.owners.forEach(o => enforcedOwners.add(o));
            }

            // Case: a `# suggest:` owner is textually identical to an already-enforced
            // owner for a file in this PR. GitHub already auto-requests the enforced
            // owner from the real CODEOWNERS line, so suggesting them again is a pure
            // duplicate — drop them before we ever build the reviewer lists.
            for (const owner of enforcedOwners) suggested.delete(owner);

            // Case: a suggested *individual* who is already a member of a *team* that's
            // enforced for a file in this PR. They're implicitly already on the hook via
            // the team requirement, so an extra individual request would be noise.
            const enforcedTeamSlugs = [...enforcedOwners]
              .filter(o => o.includes('/'))
              .map(o => o.replace(/^@/, ''));

            const enforcedTeamMembers = new Set();
            if (enforcedTeamSlugs.length > 0) {
              if (process.env.TEAM_TOKEN) {
                // `require('@actions/github')` is NOT available inside github-script's
                // sandbox (it's bundled into the action itself, not a real node_module
                // on disk) -- and don't trust Octokit's own auth plugin to respect a
                // per-call header override on the shared, pre-authenticated `github`
                // client either (see the reviewer-request call below for why). Use a
                // plain fetch() with manual pagination so there's no ambiguity about
                // which credential is actually sent.
                for (const teamPath of enforcedTeamSlugs) {
                  const [org, team_slug] = teamPath.split('/');
                  try {
                    let page = 1;
                    let members = [];
                    while (true) {
                      const res = await fetch(
                        `https://api.github.com/orgs/${org}/teams/${team_slug}/members?per_page=100&page=${page}`,
                        {
                          headers: {
                            authorization: `token ${process.env.TEAM_TOKEN}`,
                            accept: 'application/vnd.github+json',
                            'x-github-api-version': '2026-03-10',
                            'user-agent': 'suggest-reviewers-workflow',
                          },
                        }
                      );
                      if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${await res.text()}`);
                      const batch = await res.json();
                      members = members.concat(batch);
                      if (batch.length < 100) break;
                      page += 1;
                    }
                    members.forEach(m => enforcedTeamMembers.add(m.login.toLowerCase()));
                  } catch (err) {
                    core.warning(`Could not list members of enforced team ${teamPath}: ${err.message}`);
                  }
                }
              } else {
                core.warning('TEAM_TOKEN not set (no app-id or TEAM_REVIEWER_PAT provided) — skipping the enforced-team-membership check for suggested reviewers.');
              }
            }

            // GitHub logins/mentions are case-insensitive; compare lowercased so a
            // casing mismatch between CODEOWNERS and the PR author's login can't slip
            // the author into their own reviewer batch.
            const prAuthor = context.payload.pull_request.user.login;
            const prAuthorLower = prAuthor.toLowerCase();

            const reviewers = [];
            const teamReviewers = [];
            for (const owner of suggested) {
              const name = owner.replace(/^@/, '');
              if (name.includes('/')) {
                teamReviewers.push(name.split('/')[1]);
              } else if (name.toLowerCase() === prAuthorLower) {
                continue;
              } else if (enforcedTeamMembers.has(name.toLowerCase())) {
                core.info(`Skipping suggested reviewer @${name}: already a member of a team enforced for this PR.`);
              } else {
                reviewers.push(name);
              }
            }

            if (reviewers.length === 0 && teamReviewers.length === 0) {
              core.info('No suggested reviewers matched the changed files.');
              return;
            }

            // Already-requested/already-reviewed users cause a 422; drop anyone already
            // in either state so a re-run (e.g. on `synchronize`) doesn't fail the job.
            const [{ data: existingReviewRequests }, { data: existingReviews }] = await Promise.all([
              github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
              github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
            ]);
            // A review's `user` can be null (deleted/ghost GitHub account) per
            // GitHub's own API schema — filter those out rather than crash.
            const alreadyUsers = new Set([
              ...existingReviewRequests.users.map(u => u.login),
              ...existingReviews.filter(r => r.user).map(r => r.user.login),
            ]);
            const alreadyTeams = new Set(existingReviewRequests.teams.map(t => t.slug));

            const newReviewers = reviewers.filter(r => !alreadyUsers.has(r));
            const newTeamReviewers = teamReviewers.filter(t => !alreadyTeams.has(t));

            if (newReviewers.length === 0 && newTeamReviewers.length === 0) {
              core.info('Suggested reviewers already requested or already reviewed, nothing to do.');
              return;
            }

            // Single batch call: GitHub validates the whole payload atomically, so one
            // invalid entry (no repo access, etc.) fails the entire request. That's an
            // advisory feature breaking silently, not a CI failure — so on error we warn
            // and surface it for a Slack alert (next step), but never fail the workflow.
            //
            // Requesting a TEAM as a reviewer via the default GITHUB_TOKEN (or a GitHub
            // App installation token — both tried and confirmed broken live) fails with
            // "Could not resolve to a node with the global id of '...'". This is a
            // confirmed GitHub API limitation, not a scope gap: a token tied to a real
            // human/service-account identity is the only thing that has worked in every
            // case we found, including our own live testing. Individual-user requests
            // work fine on the default token regardless; only route through the PAT when
            // a team reviewer is actually in this batch.
            try {
              const requestOptions = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: newReviewers,
                team_reviewers: newTeamReviewers,
              };
              if (newTeamReviewers.length > 0 && process.env.TEAM_TOKEN) {
                // Bypass github-script's shared, pre-authenticated Octokit client entirely
                // for this call. Overriding just the `headers.authorization` on that
                // client (as done elsewhere in this script) trusts Octokit's own auth
                // plugin to respect the override rather than re-applying its default
                // GITHUB_TOKEN auth -- worth not trusting blindly here, since the exact
                // same token value succeeds via a plain `gh api` call but was failing
                // through that path, which is consistent with the override silently not
                // taking effect. A raw fetch() removes any ambiguity about which
                // credential is actually sent.
                const res = await fetch(
                  `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/pulls/${context.issue.number}/requested_reviewers`,
                  {
                    method: 'POST',
                    headers: {
                      authorization: `token ${process.env.TEAM_TOKEN}`,
                      accept: 'application/vnd.github+json',
                      'x-github-api-version': '2026-03-10',
                      'content-type': 'application/json',
                      'user-agent': 'suggest-reviewers-workflow',
                    },
                    body: JSON.stringify({ reviewers: newReviewers, team_reviewers: newTeamReviewers }),
                  }
                );
                if (!res.ok) {
                  const body = await res.text();
                  throw new Error(`${res.status} ${res.statusText}: ${body}`);
                }
              } else {
                await github.rest.pulls.requestReviewers(requestOptions);
              }
            } catch (err) {
              core.warning(`Could not request suggested reviewers: ${err.message}`);
              const attempted = [...newReviewers.map(r => '@' + r), ...newTeamReviewers.map(t => '@' + t)].join(', ') || '(none)';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              core.setOutput('failure_message', `suggest-reviewers could not request suggested reviewers on ${context.payload.pull_request.html_url}\n` +
                `Attempted: ${attempted}\nError: ${err.message}\nWorkflow: ${runUrl}`);
              // `secrets.*` isn't available in a step-level `if:` condition, so decide
              // here (where env vars ARE available) whether the next step should run,
              // and pass that decision through as a plain output instead.
              core.setOutput('should_alert_slack', process.env.SLACK_WEBHOOK ? 'true' : 'false');
            }

      - name: Alert Slack on request failure
        if: steps.suggest.outputs.should_alert_slack == 'true'
        uses: ./ci-templates/.github/actions/send-slack-alert
        with:
          message: ${{ steps.suggest.outputs.failure_message }}
          webhook: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}

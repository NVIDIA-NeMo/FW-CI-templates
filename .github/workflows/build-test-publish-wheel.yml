name: Test Build, Test, Publish Wheel
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/*wheel.yml'
      - 'tests/test_wheel_workflows.py'
      - 'tests/fixtures/**'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==9.1.1' 'PyYAML==6.0.3'
      - run: python -m pytest tests/test_wheel_workflows.py

  legacy-build-test:
    needs: contract-tests
    uses: ./.github/workflows/_build_test_publish_wheel.yml
    with:
      python-package: fw_ci_templates_smoke
      root-dir: tests/fixtures/wheel-project/
      no-publish: true
      suppress-failure-notify: true

  artifact-only-build-test:
    needs: legacy-build-test
    uses: ./.github/workflows/_build_test_wheel.yml
    with:
      python-package: fw_ci_templates_smoke
      root-dir: tests/fixtures/wheel-project/

  compare-outputs:
    needs: [legacy-build-test, artifact-only-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Compare public outputs
        env:
          LEGACY: ${{ toJSON(needs.legacy-build-test.outputs) }}
          BUILDER: ${{ toJSON(needs.artifact-only-build-test.outputs) }}
        run: |
          python - <<'PY'
          import json
          import os
          legacy = json.loads(os.environ['LEGACY'])
          builder = json.loads(os.environ['BUILDER'])
          assert legacy == builder, (legacy, builder)
          assert legacy['version'] == '0.0.1', legacy
          assert legacy['pypi-name'] == 'fw-ci-templates-smoke', legacy
          assert legacy['artifact-name'], legacy
          PY

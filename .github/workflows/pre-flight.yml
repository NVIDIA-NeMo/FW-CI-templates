name: Test Pre-flight
on:
  pull_request:

jobs:
  guardwords-tests:
    name: Guardwords tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python3 -I -m pip install --quiet --disable-pip-version-check --no-input "PyYAML==6.0.2"
      - name: Run scanner and fetch tests
        run: |
          python3 -I -m unittest discover -s .github/scripts -p "test_guardwords.py"
          python3 -I -m unittest discover -s .github/scripts -p "test_fetch_pr_description.py"

  code-freeze-tests:
    name: Code freeze tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Run tests
        run: python3 -m unittest discover -s .github/scripts -p "test_code_freeze.py"

  sso-download-tests:
    name: SSO download tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run tests
        run: python3 -m unittest discover -s .github/actions/check-nvidia-sso -p "test_*.py"

  send-slack-alert-tests:
    name: Send Slack alert tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run tests
        run: python3 -m unittest discover -s .github/actions/send-slack-alert -p "test_*.py"

  notify-ci-failure-tests:
    name: CI failure notification tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run tests
        run: python3 -m unittest discover -s .github/actions/notify-ci-failure -p "test_*.py"

  pre-flight:
    uses: ./.github/workflows/_cicd_preflight.yml

name: Test MBridge orchestrator

on:
  pull_request:
    paths:
      - .github/scripts/test_mbridge_orchestrator.py
      - .github/workflows/_mbridge_orchestrator.yml
      - .github/workflows/test-mbridge-orchestrator.yml
  push:
    branches:
      - main
    paths:
      - .github/scripts/test_mbridge_orchestrator.py
      - .github/workflows/_mbridge_orchestrator.yml
      - .github/workflows/test-mbridge-orchestrator.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate orchestrator runtime
        run: |
          command -v python3
          command -v openssl

      - name: Test orchestrator
        run: python3 .github/scripts/test_mbridge_orchestrator.py -v

      - name: Validate workflow trust boundary
        env:
          WORKFLOW: .github/workflows/_mbridge_orchestrator.yml
        run: |
          grep -F 'permissions: {}' "$WORKFLOW"
          ! grep -F 'github.token' "$WORKFLOW"
          ! grep -F 'actions/create-github-app-token' "$WORKFLOW"
          ! grep -F 'actions/github-script' "$WORKFLOW"
          ! grep -F 'node <<' "$WORKFLOW"
          ! find .github/scripts -maxdepth 1 -type f -name '*mbridge*' ! -name 'test_mbridge_orchestrator.py' | grep -q .
          ! grep -F 'actions/checkout' "$WORKFLOW"
